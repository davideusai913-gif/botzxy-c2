services:
  - type: web
    name: botzxy-c2
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k eventlet app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
    plan: free
    healthCheckPath: /