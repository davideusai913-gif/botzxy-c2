<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BotZXY · Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        /* ---- RESET & BASE ---- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0b0b1a;
            color: #e2e8f0;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(120, 80, 255, 0.06) 0%, transparent 50%),
                radial-gradient(circle at 90% 80%, rgba(0, 200, 255, 0.06) 0%, transparent 50%);
        }

        /* ---- SIDEBAR ---- */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 72px;
            background: rgba(18, 18, 40, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.2rem 0;
            gap: 1.2rem;
            z-index: 50;
            transition: width 0.3s ease;
        }

        .sidebar:hover {
            width: 200px;
        }

        .sidebar .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a78bfa, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
            white-space: nowrap;
            overflow: hidden;
            width: 100%;
            text-align: center;
            padding: 0 0.5rem;
        }

        .sidebar .logo span {
            -webkit-text-fill-color: rgba(255, 255, 255, 0.15);
        }

        .sidebar .nav {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            width: 100%;
            flex: 1;
            align-items: center;
        }

        .sidebar .nav a {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.7rem 1rem;
            width: 90%;
            border-radius: 14px;
            color: rgba(255, 255, 255, 0.3);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            white-space: nowrap;
            overflow: hidden;
        }

        .sidebar .nav a i {
            font-size: 1.2rem;
            min-width: 24px;
            text-align: center;
        }

        .sidebar .nav a:hover,
        .sidebar .nav a.active {
            color: #fff;
            background: rgba(120, 80, 255, 0.15);
            box-shadow: 0 0 30px rgba(120, 80, 255, 0.05);
        }

        .sidebar .nav a.active {
            color: #a78bfa;
            background: rgba(120, 80, 255, 0.12);
            border-left: 3px solid #a78bfa;
        }

        .sidebar .version {
            font-size: 0.6rem;
            color: rgba(255, 255, 255, 0.08);
            letter-spacing: 0.1em;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            padding: 0.5rem 0;
        }

        /* ---- MAIN ---- */
        .main {
            margin-left: 72px;
            padding: 2rem 2.5rem;
            transition: margin-left 0.3s ease;
        }

        .sidebar:hover ~ .main {
            margin-left: 200px;
        }

        /* ---- STATS CARDS ---- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1.2rem;
            margin-bottom: 2.5rem;
        }

        .stat-card {
            background: rgba(18, 18, 40, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 24px;
            padding: 1.5rem 1.8rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .stat-card:hover {
            transform: translateY(-4px);
            border-color: rgba(120, 80, 255, 0.2);
            box-shadow: 0 0 40px rgba(120, 80, 255, 0.04);
        }

        .stat-card .icon {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            flex-shrink: 0;
        }

        .stat-card .icon.purple {
            background: rgba(120, 80, 255, 0.12);
            color: #a78bfa;
            box-shadow: 0 0 20px rgba(120, 80, 255, 0.05);
        }
        .stat-card .icon.cyan {
            background: rgba(34, 211, 238, 0.12);
            color: #22d3ee;
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.05);
        }
        .stat-card .icon.pink {
            background: rgba(236, 72, 153, 0.12);
            color: #f472b6;
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.05);
        }
        .stat-card .icon.green {
            background: rgba(52, 211, 153, 0.12);
            color: #34d399;
            box-shadow: 0 0 20px rgba(52, 211, 153, 0.05);
        }

        .stat-card .info .number {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .stat-card .info .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: rgba(255, 255, 255, 0.25);
            font-weight: 600;
        }

        /* ---- TABELLA DEVICES ---- */
        .card-table {
            background: rgba(18, 18, 40, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 28px;
            padding: 1.8rem 1.8rem 2rem;
            overflow: hidden;
        }

        .card-table .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .card-table .header h2 {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .card-table .header h2 i {
            color: #a78bfa;
        }

        .card-table .header .badge {
            font-size: 0.6rem;
            background: rgba(120, 80, 255, 0.15);
            padding: 0.3rem 0.9rem;
            border-radius: 40px;
            color: #a78bfa;
            border: 1px solid rgba(120, 80, 255, 0.1);
            letter-spacing: 0.05em;
        }

        .card-table .header .btn-refresh {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.4);
            padding: 0.4rem 0.9rem;
            border-radius: 40px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .card-table .header .btn-refresh:hover {
            background: rgba(120, 80, 255, 0.1);
            color: #fff;
            border-color: rgba(120, 80, 255, 0.2);
        }

        /* ---- TABLE ---- */
        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        thead th {
            text-align: left;
            padding: 0.6rem 0.4rem;
            color: rgba(255, 255, 255, 0.2);
            font-weight: 600;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        tbody td {
            padding: 0.8rem 0.4rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            vertical-align: middle;
        }

        tbody tr {
            transition: all 0.2s ease;
        }

        tbody tr:hover {
            background: rgba(255, 255, 255, 0.02);
        }

        .badge-status {
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .badge-status.online {
            background: rgba(52, 211, 153, 0.12);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.1);
        }
        .badge-status.online::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #34d399;
            box-shadow: 0 0 10px rgba(52, 211, 153, 0.4);
            animation: dotPulse 1.8s ease-in-out infinite;
        }

        .badge-status.offline {
            background: rgba(239, 68, 68, 0.08);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.06);
        }
        .badge-status.offline::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #f87171;
        }

        @keyframes dotPulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.7); }
        }

        .platform-icon {
            font-size: 1.1rem;
            opacity: 0.6;
        }

        .btn-action {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.2);
            padding: 0.3rem 0.5rem;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.85rem;
        }

        .btn-action:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.04);
        }

        .btn-action.primary:hover {
            color: #a78bfa;
            background: rgba(120, 80, 255, 0.08);
        }
        .btn-action.danger:hover {
            color: #f87171;
            background: rgba(239, 68, 68, 0.08);
        }
        .btn-action.success:hover {
            color: #34d399;
            background: rgba(52, 211, 153, 0.08);
        }

        /* ---- RESPONSIVE ---- */
        @media (max-width: 768px) {
            .sidebar {
                width: 56px;
                padding: 0.8rem 0;
            }
            .sidebar .logo {
                font-size: 1.2rem;
            }
            .sidebar .nav a span {
                display: none;
            }
            .sidebar:hover {
                width: 56px;
            }
            .main {
                margin-left: 56px;
                padding: 1.2rem;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.8rem;
            }
            .stat-card {
                padding: 1rem;
            }
            .stat-card .info .number {
                font-size: 1.4rem;
            }
            .card-table {
                padding: 1rem;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 0.6rem;
            }
            .stat-card .icon {
                width: 36px;
                height: 36px;
                font-size: 1rem;
            }
            .stat-card .info .number {
                font-size: 1.2rem;
            }
        }

        /* ---- SCROLLBAR ---- */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(120, 80, 255, 0.3);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="logo">Bot<span>ZXY</span></div>
        <nav class="nav">
            <a href="#" class="active"><i class="fas fa-tachometer-alt"></i><span>Dashboard</span></a>
            <a href="#"><i class="fas fa-mobile-alt"></i><span>Devices</span></a>
            <a href="#"><i class="fas fa-camera"></i><span>Captures</span></a>
            <a href="#"><i class="fas fa-history"></i><span>Logs</span></a>
            <a href="#"><i class="fas fa-cog"></i><span>Settings</span></a>
        </nav>
        <div class="version">NEON v2.0</div>
    </aside>

    <!-- MAIN -->
    <main class="main">

        <!-- STATS -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="icon purple"><i class="fas fa-mobile-alt"></i></div>
                <div class="info">
                    <div class="number" id="totalDevices">0</div>
                    <div class="label">Total Devices</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="icon cyan"><i class="fas fa-wifi"></i></div>
                <div class="info">
                    <div class="number" id="onlineDevices">0</div>
                    <div class="label">Online Bots</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="icon pink"><i class="fas fa-camera"></i></div>
                <div class="info">
                    <div class="number" id="totalCaptures">0</div>
                    <div class="label">Captures</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="icon green"><i class="fas fa-terminal"></i></div>
                <div class="info">
                    <div class="number" id="totalCommands">0</div>
                    <div class="label">Commands</div>
                </div>
            </div>
        </div>

        <!-- TABELLA -->
        <div class="card-table">
            <div class="header">
                <h2><i class="fas fa-robot"></i> BotZXY Connected Devices</h2>
                <div>
                    <span class="badge"><i class="fas fa-bolt"></i> ACTIVE</span>
                    <button class="btn-refresh" onclick="refreshDevices()">
                        <i class="fas fa-sync"></i> Refresh
                    </button>
                </div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Platform</th>
                            <th>Hostname</th>
                            <th>IP</th>
                            <th>Status</th>
                            <th>Last Seen</th>
                            <th>Phone</th>
                            <th style="text-align:right;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="devicesBody">
                        <!-- JS le popola -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        // ---- DATI DI ESEMPIO (poi sostituisci con le tue API) ----
        let devicesData = [];

        function refreshDevices() {
            // Simula caricamento
            const tbody = document.getElementById('devicesBody');
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:2rem; color:rgba(255,255,255,0.1);">
                <i class="fas fa-spinner fa-spin" style="font-size:1.2rem;"></i> Caricamento...
            </tr>`;

            // Chiamata API reale (se il backend è pronto)
            fetch('/api/devices')
                .then(res => res.json())
                .then(data => {
                    devicesData = data;
                    renderDevices(data);
                    updateStats(data);
                })
                .catch(() => {
                    // Fallback: dati demo
                    const demo = [
                        { device_id: 'win-001', platform: 'windows', hostname: 'DESKTOP-ABC', ip: '192.168.1.10', is_online: true, last_seen: new Date().toISOString(), phone_number: '+39 345 678 9012' },
                        { device_id: 'and-002', platform: 'android', hostname: 'Pixel 6', ip: '192.168.1.20', is_online: true, last_seen: new Date().toISOString(), phone_number: '+39 333 444 5555' },
                        { device_id: 'ios-003', platform: 'ios', hostname: 'iPhone 14', ip: '192.168.1.30', is_online: false, last_seen: new Date(Date.now() - 3600000).toISOString(), phone_number: '+39 333 222 1111' },
                    ];
                    devicesData = demo;
                    renderDevices(demo);
                    updateStats(demo);
                });
        }

        function renderDevices(devices) {
            const tbody = document.getElementById('devicesBody');
            if (!devices || devices.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:2rem; color:rgba(255,255,255,0.1);">
                    <i class="fas fa-robot" style="font-size:1.2rem;"></i> Nessun dispositivo connesso
                </td></tr>`;
                return;
            }

            let html = '';
            devices.forEach(d => {
                const statusClass = d.is_online ? 'online' : 'offline';
                const statusText = d.is_online ? 'Online' : 'Offline';
                const icon = d.platform === 'windows' ? 'fa-windows' :
                             d.platform === 'android' ? 'fa-android' :
                             d.platform === 'ios' ? 'fa-apple' : 'fa-microchip';
                const lastSeen = d.last_seen ? new Date(d.last_seen).toLocaleString() : 'Never';

                html += `
                <tr>
                    <td><code style="color:#a78bfa; font-size:0.7rem;">${d.device_id.substring(0, 14)}...</code></td>
                    <td><i class="fab ${icon} platform-icon" style="opacity:0.7;"></i> ${d.platform || 'Unknown'}</td>
                    <td><strong style="font-weight:500;">${d.hostname || 'Unknown'}</strong></td>
                    <td style="color:rgba(255,255,255,0.3);">${d.ip || 'N/A'}</td>
                    <td><span class="badge-status ${statusClass}">${statusText}</span></td>
                    <td style="font-size:0.7rem; color:rgba(255,255,255,0.2);">${lastSeen}</td>
                    <td style="font-size:0.8rem;">${d.phone_number || '—'}</td>
                    <td style="text-align:right;">
                        <button class="btn-action success" onclick="sendCommand('${d.device_id}')" title="Invia comando"><i class="fas fa-terminal"></i></button>
                        <button class="btn-action primary" onclick="viewDevice('${d.device_id}')" title="Dettagli"><i class="fas fa-eye"></i></button>
                        <button class="btn-action danger" onclick="removeDevice('${d.device_id}')" title="Rimuovi"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        function updateStats(devices) {
            const total = devices.length;
            const online = devices.filter(d => d.is_online).length;
            document.getElementById('totalDevices').textContent = total;
            document.getElementById('onlineDevices').textContent = online;
            // Captures e commands sono placeholder
            document.getElementById('totalCaptures').textContent = '24';
            document.getElementById('totalCommands').textContent = '12';
        }

        // ---- ACTION STUB ----
        function sendCommand(id) {
            alert(`📡 Comando inviato a ${id.substring(0, 8)}...`);
        }
        function viewDevice(id) {
            alert(`👁️ Dettagli dispositivo: ${id}`);
        }
        function removeDevice(id) {
            if (confirm(`⚠️ Rimuovere il dispositivo ${id.substring(0, 8)}...?`)) {
                alert('✅ Dispositivo rimosso (simulato)');
                refreshDevices();
            }
        }

        // ---- AUTO REFRESH ----
        refreshDevices();
        setInterval(refreshDevices, 15000);
    </script>

</body>
</html>
