<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BotZXY · Impostazioni</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0b0b1a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
        }
        /* Sidebar (stessa della dashboard) */
        .sidebar {
            width: 220px;
            background: rgba(12,12,35,0.92);
            backdrop-filter: blur(24px);
            border-right: 1px solid rgba(255,255,255,0.04);
            padding: 1.8rem 1.2rem;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            z-index: 100;
        }
        .sidebar .logo {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #8b5cf6, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .sidebar .logo i { -webkit-text-fill-color: initial; color: #8b5cf6; }
        .sidebar .logo span { -webkit-text-fill-color: rgba(255,255,255,0.1); }
        .sidebar .nav { display: flex; flex-direction: column; gap: 0.2rem; flex: 1; padding-top: 1.2rem; }
        .sidebar .nav a {
            display: flex; align-items: center; gap: 0.8rem; padding: 0.7rem 1rem;
            border-radius: 12px; color: rgba(255,255,255,0.3); text-decoration: none;
            font-size: 0.85rem; font-weight: 500; transition: all 0.3s;
        }
        .sidebar .nav a i { font-size: 1.1rem; min-width: 24px; }
        .sidebar .nav a:hover { color: #fff; background: rgba(139,92,246,0.08); }
        .sidebar .nav a.active { color: #8b5cf6; background: rgba(139,92,246,0.1); }
        .sidebar .nav a .badge-nav { margin-left: auto; background: rgba(139,92,246,0.15); color: #8b5cf6; font-size: 0.6rem; padding: 0.1rem 0.6rem; border-radius: 40px; }
        .sidebar .footer-sidebar {
            font-size: 0.6rem; color: rgba(255,255,255,0.06); text-align: center;
            padding-top: 1rem; border-top: 1px solid rgba(255,255,255,0.04);
            letter-spacing: 0.05em;
        }
        .sidebar .footer-sidebar .status-dot {
            display: inline-block; width: 6px; height: 6px; border-radius: 50%;
            background: #34d399; box-shadow: 0 0 12px rgba(52,211,153,0.4);
            animation: pulse 2s ease-in-out infinite; margin-right: 6px;
        }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

        .main { margin-left: 220px; padding: 1.8rem 2.2rem; width: 100%; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 0.8rem; }
        .topbar h1 { font-size: 1.4rem; font-weight: 600; }
        .topbar h1 span { color: rgba(255,255,255,0.2); font-weight: 400; }
        .topbar .actions { display: flex; gap: 0.6rem; flex-wrap: wrap; }
        .btn-ghost {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.4); padding: 0.4rem 1rem; border-radius: 40px;
            cursor: pointer; font-size: 0.75rem; transition: all 0.3s;
            display: flex; align-items: center; gap: 0.4rem;
        }
        .btn-ghost:hover { background: rgba(139,92,246,0.08); color: #fff; border-color: rgba(139,92,246,0.2); }
        .btn-primary {
            background: linear-gradient(135deg, #7c3aed, #3b82f6);
            border: none; color: #fff; padding: 0.5rem 1.5rem; border-radius: 12px;
            cursor: pointer; font-weight: 600; font-family: 'Inter', sans-serif;
            transition: all 0.3s;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(120,80,255,0.2); }

        .settings-card {
            background: rgba(18,18,40,0.45); backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.04); border-radius: 24px;
            padding: 1.8rem;
            max-width: 600px;
        }
        .settings-group { margin-bottom: 1.8rem; }
        .settings-group label { display: block; font-size: 0.75rem; font-weight: 600; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.4rem; }
        .settings-group .desc { font-size: 0.7rem; color: rgba(255,255,255,0.2); margin-top: 0.2rem; }
        .settings-group select, .settings-group input {
            width: 100%; padding: 0.6rem 1rem; border-radius: 12px;
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
            color: #fff; font-family: 'Inter', sans-serif; font-size: 0.9rem;
            transition: all 0.3s;
        }
        .settings-group select:focus, .settings-group input:focus {
            outline: none; border-color: #8b5cf6; box-shadow: 0 0 0 4px rgba(139,92,246,0.1);
        }
        .settings-group select option { background: #1a1a3a; color: #fff; }

        .theme-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.6rem;
            margin-top: 0.4rem;
        }
        .theme-option {
            padding: 0.6rem; border-radius: 12px; text-align: center;
            border: 2px solid rgba(255,255,255,0.04); cursor: pointer;
            transition: all 0.3s; font-size: 0.7rem; font-weight: 500;
        }
        .theme-option:hover { border-color: rgba(139,92,246,0.3); }
        .theme-option.active { border-color: #8b5cf6; background: rgba(139,92,246,0.08); }
        .theme-option .preview {
            width: 100%; height: 30px; border-radius: 8px; margin-bottom: 0.3rem;
        }
        .theme-option.dark .preview { background: #0b0b1a; border: 1px solid #333; }
        .theme-option.light .preview { background: #f1f5f9; border: 1px solid #ddd; }
        .theme-option.blue .preview { background: #1a2a6a; border: 1px solid #2a4a8a; }
        .theme-option.green .preview { background: #0a2a1a; border: 1px solid #1a4a2a; }
        .theme-option.purple .preview { background: #2a0a4a; border: 1px solid #4a1a6a; }
        .theme-option.orange .preview { background: #4a2a0a; border: 1px solid #6a4a1a; }
        .theme-option.cyber .preview { background: #0a0a0a; border: 1px solid #00ff88; box-shadow: 0 0 20px rgba(0,255,136,0.05); }
        .theme-option.matrix .preview { background: #0a0a0a; border: 1px solid #00ff00; box-shadow: 0 0 20px rgba(0,255,0,0.05); }

        .toast { position: fixed; bottom: 20px; right: 20px; background: #1a1a3a; border: 1px solid #00ff88; padding: 0.8rem 1.2rem; border-radius: 12px; color: #fff; font-size: 0.85rem; z-index: 999; display: none; align-items: center; gap: 0.6rem; }
        .toast.show { display: flex; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); width: 240px; }
            .sidebar.open { transform: translateX(0); }
            .main { margin-left: 0; padding: 1rem; }
            .theme-grid { grid-template-columns: repeat(2, 1fr); }
        }
        .sidebar-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 90; }
        .sidebar-overlay.active { display: block; }
        .hamburger { display: none; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); color: #fff; padding: 0.4rem 0.8rem; border-radius: 10px; cursor: pointer; }
        @media (max-width: 768px) { .hamburger { display: block; } }
    </style>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="logo"><i class="fas fa-robot"></i> Bot<span>ZXY</span></div>
        <nav class="nav">
            <a href="/dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="#"><i class="fas fa-mobile-alt"></i> Devices <span class="badge-nav" id="deviceBadge">0</span></a>
            <a href="#"><i class="fas fa-camera"></i> Captures <span class="badge-nav" id="captureBadge">0</span></a>
            <a href="#"><i class="fas fa-chart-pie"></i> Analytics</a>
            <a href="/logs"><i class="fas fa-history"></i> Logs</a>
            <a href="#" class="active"><i class="fas fa-cog"></i> Settings</a>
            <a href="/logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </nav>
        <div class="footer-sidebar"><span class="status-dot"></span> Sistema attivo · <span id="footerTime"></span></div>
    </aside>

    <main class="main">
        <div class="topbar">
            <div style="display:flex;align-items:center;gap:0.8rem;">
                <button class="hamburger" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <h1>Impostazioni <span>| Personalizzazione</span></h1>
            </div>
            <div class="actions">
                <button class="btn-ghost" onclick="loadSettings()"><i class="fas fa-sync"></i> Ricarica</button>
            </div>
        </div>

        <div class="settings-card">
            <div class="settings-group">
                <label><i class="fas fa-palette"></i> Tema</label>
                <div class="theme-grid" id="themeGrid">
                    <div class="theme-option dark active" data-theme="dark" onclick="selectTheme('dark')">
                        <div class="preview"></div>
                        Scuro
                    </div>
                    <div class="theme-option light" data-theme="light" onclick="selectTheme('light')">
                        <div class="preview"></div>
                        Chiaro
                    </div>
                    <div class="theme-option blue" data-theme="blue" onclick="selectTheme('blue')">
                        <div class="preview"></div>
                        Blu
                    </div>
                    <div class="theme-option green" data-theme="green" onclick="selectTheme('green')">
                        <div class="preview"></div>
                        Verde
                    </div>
                    <div class="theme-option purple" data-theme="purple" onclick="selectTheme('purple')">
                        <div class="preview"></div>
                        Viola
                    </div>
                    <div class="theme-option orange" data-theme="orange" onclick="selectTheme('orange')">
                        <div class="preview"></div>
                        Arancione
                    </div>
                    <div class="theme-option cyber" data-theme="cyber" onclick="selectTheme('cyber')">
                        <div class="preview"></div>
                        Cyber
                    </div>
                    <div class="theme-option matrix" data-theme="matrix" onclick="selectTheme('matrix')">
                        <div class="preview"></div>
                        Matrix
                    </div>
                </div>
                <div class="desc">Seleziona il tema preferito per il dashboard</div>
            </div>

            <div class="settings-group">
                <label><i class="fas fa-language"></i> Lingua</label>
                <select id="languageSelect">
                    <option value="it">🇮🇹 Italiano</option>
                    <option value="en">🇬🇧 English</option>
                    <option value="fr">🇫🇷 Français</option>
                    <option value="es">🇪🇸 Español</option>
                    <option value="de">🇩🇪 Deutsch</option>
                </select>
                <div class="desc">Lingua dell'interfaccia</div>
            </div>

            <div class="settings-group">
                <label><i class="fas fa-bell"></i> Notifiche</label>
                <select id="notificationsSelect">
                    <option value="on">🔔 Attive</option>
                    <option value="off">🔕 Disattivate</option>
                </select>
                <div class="desc">Ricevi notifiche per nuovi dispositivi e comandi</div>
            </div>

            <button class="btn-primary" onclick="saveSettings()">
                <i class="fas fa-save"></i> Salva impostazioni
            </button>
        </div>
    </main>

    <div class="toast" id="toast"><i class="fas fa-check-circle" style="color:#00ff88;"></i> <span id="toastMsg">Salvato!</span></div>

    <script>
        let currentTheme = 'dark';

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function selectTheme(theme) {
            currentTheme = theme;
            document.querySelectorAll('.theme-option').forEach(el => el.classList.remove('active'));
            document.querySelector(`.theme-option[data-theme="${theme}"]`).classList.add('active');
            
            // Applica tema alla pagina
            const body = document.body;
            const themes = {
                'dark': { bg: '#0b0b1a', text: '#e2e8f0', card: 'rgba(18,18,40,0.45)' },
                'light': { bg: '#f1f5f9', text: '#0a0a1a', card: 'rgba(255,255,255,0.85)' },
                'blue': { bg: '#0a1a3a', text: '#e2e8f0', card: 'rgba(10,26,58,0.7)' },
                'green': { bg: '#0a1a0a', text: '#e2e8f0', card: 'rgba(10,26,10,0.7)' },
                'purple': { bg: '#1a0a2a', text: '#e2e8f0', card: 'rgba(26,10,42,0.7)' },
                'orange': { bg: '#2a1a0a', text: '#e2e8f0', card: 'rgba(42,26,10,0.7)' },
                'cyber': { bg: '#0a0a0a', text: '#00ff88', card: 'rgba(0,0,0,0.7)' },
                'matrix': { bg: '#0a0a0a', text: '#00ff00', card: 'rgba(0,0,0,0.7)' }
            };
            
            const t = themes[theme] || themes['dark'];
            body.style.background = t.bg;
            body.style.color = t.text;
            document.querySelectorAll('.settings-card, .card').forEach(el => {
                el.style.background = t.card;
            });
        }

        function loadSettings() {
            fetch('/api/settings')
                .then(res => res.json())
                .then(data => {
                    if (data.theme) {
                        selectTheme(data.theme);
                        document.getElementById('languageSelect').value = data.language || 'it';
                        document.getElementById('notificationsSelect').value = data.notifications || 'on';
                    }
                })
                .catch(() => showToast('Errore caricamento impostazioni'));
        }

        function saveSettings() {
            const theme = currentTheme;
            const language = document.getElementById('languageSelect').value;
            const notifications = document.getElementById('notificationsSelect').value;

            fetch('/api/settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ theme, language, notifications })
            })
            .then(res => res.json())
            .then(() => {
                showToast('✅ Impostazioni salvate!');
                localStorage.setItem('botzxy_theme', theme);
            })
            .catch(() => showToast('❌ Errore salvataggio'));
        }

        // Carica tema salvato
        const savedTheme = localStorage.getItem('botzxy_theme') || 'dark';
        selectTheme(savedTheme);

        // Stats per badges
        fetch('/api/stats')
            .then(res => res.json())
            .then(data => {
                document.getElementById('deviceBadge').textContent = data.total_devices || 0;
                document.getElementById('captureBadge').textContent = data.total_captures || 0;
            });

        function updateTime() {
            document.getElementById('footerTime').textContent = new Date().toLocaleTimeString('it-IT');
        }

        loadSettings();
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
