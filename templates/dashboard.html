<script>
    // ---- STATO ----
    let devicesData = [];
    let activityChart = null;
    let platformChart = null;
    let statsData = {};

    // ---- TOGGLE SIDEBAR (mobile) ----
    function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('open');
        document.getElementById('sidebarOverlay').classList.toggle('active');
    }

    // ---- REFRESH COMPLETO ----
    function refreshAll() {
        refreshDevices();
        refreshStats();
        refreshCharts();
    }

    // ---- REFRESH STATS ----
    function refreshStats() {
        fetch('/api/stats')
            .then(res => res.json())
            .then(data => {
                statsData = data;
                document.getElementById('totalDevices').textContent = data.total_devices || 0;
                document.getElementById('onlineDevices').textContent = data.online_devices || 0;
                document.getElementById('totalCaptures').textContent = data.total_captures || 0;
                document.getElementById('totalCommands').textContent = data.total_commands || 0;
                document.getElementById('deviceBadge').textContent = data.total_devices || 0;
                document.getElementById('captureBadge').textContent = data.total_captures || 0;
            })
            .catch(() => {
                // Fallback a 0 se API non risponde
                document.getElementById('totalDevices').textContent = '0';
                document.getElementById('onlineDevices').textContent = '0';
                document.getElementById('totalCaptures').textContent = '0';
                document.getElementById('totalCommands').textContent = '0';
            });
    }

    // ---- REFRESH DEVICES ----
    function refreshDevices() {
        const tbody = document.getElementById('devicesBody');
        tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:1.5rem; color:rgba(255,255,255,0.1);">
            <i class="fas fa-spinner fa-spin" style="font-size:1.2rem;"></i> Caricamento...
        </tr>`;

        fetch('/api/devices')
            .then(res => res.json())
            .then(data => {
                devicesData = data;
                renderDevices(data);
            })
            .catch(() => {
                tbody.innerHTML = `<tr><td colspan="8" class="empty-state">
                    <i class="fas fa-robot"></i> Errore di connessione
                </td></tr>`;
            });
    }

    function renderDevices(devices) {
        const tbody = document.getElementById('devicesBody');
        if (!devices || devices.length === 0) {
            tbody.innerHTML = `<tr><td colspan="8" class="empty-state">
                <i class="fas fa-robot"></i> Nessun dispositivo connesso
            </td></tr>`;
            return;
        }

        let html = '';
        devices.forEach(d => {
            const statusClass = d.is_online ? 'online' : 'offline';
            const statusText = d.is_online ? 'Online' : 'Offline';
            const icon = d.platform === 'windows' ? 'fa-windows' :
                         d.platform === 'android' ? 'fa-android' :
                         d.platform === 'ios' ? 'fa-apple' : 'fa-microchip';
            const lastSeen = d.last_seen ? new Date(d.last_seen).toLocaleString() : 'Never';

            html += `
            <tr>
                <td><code style="color:#a78bfa; font-size:0.65rem;">${d.device_id.substring(0, 14)}...</code></td>
                <td><i class="fab ${icon}" style="opacity:0.6; font-size:1rem;"></i> ${d.platform || 'Unknown'}</td>
                <td><strong style="font-weight:500; font-size:0.85rem;">${d.hostname || 'Unknown'}</strong></td>
                <td style="color:rgba(255,255,255,0.3); font-size:0.75rem;">${d.ip || 'N/A'}</td>
                <td><span class="badge-status ${statusClass}">${statusText}</span></td>
                <td style="font-size:0.65rem; color:rgba(255,255,255,0.2);">${lastSeen}</td>
                <td style="font-size:0.75rem;">${d.phone_number || '—'}</td>
                <td style="text-align:right; white-space:nowrap;">
                    <button class="btn-action success" onclick="sendCommand('${d.device_id}')" title="Invia comando"><i class="fas fa-terminal"></i></button>
                    <button class="btn-action primary" onclick="viewDevice('${d.device_id}')" title="Dettagli"><i class="fas fa-eye"></i></button>
                    <button class="btn-action danger" onclick="removeDevice('${d.device_id}')" title="Rimuovi"><i class="fas fa-trash"></i></button>
                </td>
            </tr>`;
        });
        tbody.innerHTML = html;
    }

    // ---- CHARTS CON DATI REALI ----
    function refreshCharts() {
        // 1. Activity Chart (dati reali ultime 24h)
        fetch('/api/chart/activity')
            .then(res => res.json())
            .then(data => {
                const ctx = document.getElementById('activityChart').getContext('2d');
                if (activityChart) activityChart.destroy();

                activityChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.labels || [],
                        datasets: [{
                            label: 'Dispositivi attivi',
                            data: data.data || [],
                            borderColor: '#a78bfa',
                            backgroundColor: 'rgba(120, 80, 255, 0.08)',
                            fill: true,
                            tension: 0.4,
                            pointRadius: 2,
                            pointBackgroundColor: '#a78bfa'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: { 
                                labels: { 
                                    color: 'rgba(255,255,255,0.3)', 
                                    font: { size: 10 } 
                                } 
                            }
                        },
                        scales: {
                            x: { 
                                ticks: { 
                                    color: 'rgba(255,255,255,0.15)', 
                                    font: { size: 8 },
                                    maxTicksLimit: 12
                                }, 
                                grid: { color: 'rgba(255,255,255,0.02)' } 
                            },
                            y: { 
                                ticks: { 
                                    color: 'rgba(255,255,255,0.15)', 
                                    font: { size: 9 }, 
                                    stepSize: 1 
                                }, 
                                grid: { color: 'rgba(255,255,255,0.02)' } 
                            }
                        }
                    }
                });
            })
            .catch(() => {
                console.log('Activity chart: nessun dato disponibile');
            });

        // 2. Platform Chart (dati reali)
        fetch('/api/chart/platforms')
            .then(res => res.json())
            .then(data => {
                const ctx2 = document.getElementById('platformChart').getContext('2d');
                if (platformChart) platformChart.destroy();

                platformChart = new Chart(ctx2, {
                    type: 'doughnut',
                    data: {
                        labels: data.labels || ['Nessun dato'],
                        datasets: [{
                            data: data.data || [1],
                            backgroundColor: data.colors || ['rgba(255,255,255,0.1)'],
                            borderColor: 'transparent'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: { 
                                position: 'bottom',
                                labels: { 
                                    color: 'rgba(255,255,255,0.4)', 
                                    font: { size: 10 }, 
                                    padding: 8 
                                }
                            }
                        }
                    }
                });
            })
            .catch(() => {
                console.log('Platform chart: nessun dato disponibile');
            });
    }

    // ---- ACTION FUNCTIONS ----
    function sendCommand(id) {
        const cmd = prompt(`📡 Invia comando a ${id.substring(0,8)}...`, 'screenshot');
        if (cmd) {
            fetch(`/api/command/${id}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ command: cmd, params: '' })
            })
            .then(() => alert('✅ Comando inviato'))
            .catch(() => alert('❌ Errore'));
        }
    }

    function viewDevice(id) {
        alert(`👁️ Dettagli dispositivo: ${id}`);
    }

    function removeDevice(id) {
        if (confirm(`⚠️ Rimuovere il dispositivo ${id.substring(0,8)}...?`)) {
            alert('✅ Dispositivo rimosso');
            refreshDevices();
        }
    }

    // ---- FOOTER TIME ----
    function updateTime() {
        const now = new Date();
        document.getElementById('footerTime').textContent = now.toLocaleTimeString('it-IT');
    }

    // ---- AUTO REFRESH ----
    function init() {
        refreshAll();
        updateTime();
        setInterval(() => { 
            refreshDevices();
            refreshStats();
            refreshCharts();
        }, 15000);
        setInterval(updateTime, 1000);
    }

    // ---- START ----
    document.addEventListener('DOMContentLoaded', init);
</script>
