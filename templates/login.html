<!DOCTYPE html>
<html>
<head>
    <title>BotZXY - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: #0a0a0a;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Segoe UI', monospace;
        }
        .login-card {
            background: #1a1a1a;
            padding: 40px;
            border-radius: 15px;
            border: 1px solid #333;
            width: 420px;
            box-shadow: 0 0 40px rgba(0,255,136,0.05);
        }
        .login-card .brand {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            color: #00ff88;
            margin-bottom: 5px;
        }
        .login-card .brand span {
            color: #0d6efd;
        }
        .login-card .subtitle {
            text-align: center;
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 30px;
            letter-spacing: 2px;
        }
        .form-control {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            padding: 12px 15px;
        }
        .form-control:focus {
            background: #2a2a2a;
            border-color: #00ff88;
            color: #fff;
            box-shadow: 0 0 20px rgba(0,255,136,0.1);
        }
        .form-control::placeholder {
            color: #666;
        }
        .btn-primary {
            background: #00ff88;
            border: none;
            color: #000;
            font-weight: bold;
            padding: 12px;
            border-radius: 8px;
            transition: 0.3s;
        }
        .btn-primary:hover {
            background: #00cc66;
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0,255,136,0.2);
        }
        .input-group-text {
            background: #2a2a2a;
            border: 1px solid #444;
            color: #00ff88;
        }
        .footer-text {
            color: #555;
            font-size: 0.75rem;
            text-align: center;
            margin-top: 20px;
        }
        .footer-text i {
            color: #00ff88;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand"><i class="fas fa-robot me-2"></i>Bot<span>ZXY</span></div>
        <form method="POST" action="/login">
            <div class="mb-3">
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Username" required>
                </div>
            </div>
            <div class="mb-3">
                <div class="input-group">
                    <span class="input-group-text"><i class="fas fa-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="fas fa-sign-in-alt me-2"></i>ACCESS DASHBOARD
            </button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
